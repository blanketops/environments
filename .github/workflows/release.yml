# =============================================================================
# release.yml — Publish GitHub Release
#
# Fires on push of a v* tag. Reads the already-current CHANGELOG.md for
# release notes and publishes a GitHub Release.
#
# CHANGELOG.md itself is generated and committed by finalize-release.yml,
# synchronously, before it merges main back into develop -- doing it there
# instead of here closes a race where this workflow (triggered
# asynchronously by the tag push) used to commit the changelog to main
# after finalize-release.yml had already synced develop, leaving develop
# permanently missing that commit.
#
# Tag-triggered release pipeline for self-hosted runners. Uses direct binaries
# (Syft for SBOMs, Cosign for signatures) instead of container actions, bypassing
# Docker daemon constraints while preserving full Sigstore keyless OIDC signing
# and GitHub artifact attestation.
#
# Secrets required:
#   APP_ID, APP_PRIVATE_KEY — GitHub App credentials, exchanged for a
#   short-lived installation token, used to check out main and publish
#   the release.
# =============================================================================
name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write     # Required for Sigstore keyless OIDC signing
  attestations: write # Required for GitHub native build provenance attestations

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-api

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate SBOM via Direct Syft Binary (Self-Hosted Safe)
        run: |
          echo "Installing Syft CLI binary..."
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "${RUNNER_TEMP}/bin"

          echo "Generating SPDX JSON SBOM..."
          "${RUNNER_TEMP}/bin/syft" dir:. -o spdx-json=sbom-crds-${{ github.ref_name }}.spdx.json

      - name: Sign Artifacts with Cosign (Keyless - using runner binary)
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          cosign sign-blob --yes \
            --output-signature crds-${{ github.ref_name }}.tar.gz.sig \
            crds-${{ github.ref_name }}.tar.gz

          cosign sign-blob --yes \
            --output-signature sbom-crds-${{ github.ref_name }}.spdx.json.sig \
            sbom-crds-${{ github.ref_name }}.spdx.json

      - name: Generate GitHub Native Artifact Attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            crds-${{ github.ref_name }}.tar.gz
            sbom-crds-${{ github.ref_name }}.spdx.json

      - name: Generate release notes
        run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

      - name: Create GitHub Release & Attach Assets via GitHub CLI (`gh`)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            crds-${{ github.ref_name }}.tar.gz \
            crds-${{ github.ref_name }}.tar.gz.sig \
            sbom-crds-${{ github.ref_name }}.spdx.json \
            sbom-crds-${{ github.ref_name }}.spdx.json.sig \
            RELEASE_NOTES.md

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 📦 Secure CRD Release Published: ${{ github.ref_name }}

          ## Completed
          - Generated CRD manifests via `mage manifests`
          - Packaged CRDs into `crds-${{ github.ref_name }}.tar.gz`
          - Generated SPDX SBOM via direct Syft binary (`sbom-crds-${{ github.ref_name }}.spdx.json`)
          - Signed all artifacts with runner-baked Cosign keyless OIDC
          - Generated GitHub build-provenance attestations
          - Published GitHub Release with archives, signatures, and release notes attached via `gh`

          ## Attached Assets
          - `crds-${{ github.ref_name }}.tar.gz` (+ `.sig`)
          - `sbom-crds-${{ github.ref_name }}.spdx.json` (+ `.sig`)
          - `RELEASE_NOTES.md`

          ## Verification Commands
          - **Sig Verification:** 
            `cosign verify-blob --certificate-identity-regexp ".*" --cert-oidc-issuer "https://token.actions.githubusercontent.com" --signature crds-${{ github.ref_name }}.tar.gz.sig crds-${{ github.ref_name }}.tar.gz`
          - **Attestation Verification:** 
            `gh attest verify crds-${{ github.ref_name }}.tar.gz --owner ${{ github.repository_owner }}`
          EOF

      - name: Releaser complete
        if: always()
        uses: blanketops/environments-bots/.github/actions/releaser@v0.1.0
        with:
          command: complete
          release: ${{ github.ref_name }}
          app-id: ${{ vars.DEVELOPER_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
