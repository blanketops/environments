name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install git-cliff (static binary)
              run: |
                  VERSION=$(curl -s https://api.github.com/repos/orhun/git-cliff/releases/latest | jq -r .tag_name)
                  curl -L https://github.com/orhun/git-cliff/releases/download/${VERSION}/git-cliff-${VERSION#v}-x86_64-unknown-linux-gnu.tar.gz -o cliff.tar.gz
                  tar -xzf cliff.tar.gz
                  chmod +x git-cliff
                  sudo mv git-cliff /usr/local/bin/

            - name: Generate release notes
              run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  body_path: RELEASE_NOTES.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
