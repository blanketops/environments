name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

env:
  REGISTRY: ghcr.io
  VENDOR_IMAGE: ghcr.io/${{ github.repository }}/vendor-snapshot

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Bundle release artifacts
  # Generates docs, exports vendor snapshot, and
  # prepares all supporting assets before release.
  # ─────────────────────────────────────────────
  bundle:
    name: Bundle Release Artifacts
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/ntlaletsi70/*
          go env -w GONOSUMDB=github.com/ntlaletsi70/*
          go env -w GOPROXY=https://proxy.golang.org,direct

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ntlaletsi70
          password: ${{ secrets.GH_PAT }}

      # ── Vendor snapshot ──────────────────────
      - name: Compute vendor tag from go.sum
        id: tag
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Export vendor snapshot as tarball
        run: |
          IMAGE="${{ env.VENDOR_IMAGE }}:${{ steps.tag.outputs.tag }}"
          echo "Pulling ${IMAGE}"
          docker pull "${IMAGE}"
          CONTAINER=$(docker create "${IMAGE}")
          docker cp "${CONTAINER}:/vendor" ./vendor
          docker rm "${CONTAINER}"
          tar -czf vendor-snapshot-${{ github.ref_name }}.tar.gz vendor/
          echo "vendor snapshot tarball: $(du -sh vendor-snapshot-${{ github.ref_name }}.tar.gz | cut -f1)"

      # ── Docs ─────────────────────────────────
      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Generate docs
        run: |
          mkdir -p docs/code
          gomarkdoc \
            --output 'docs/code/{{.Dir}}.md' \
            ./core/... \
            ./cache/... \
            ./logging/... \
            ./pkg/... \
            ./resolution/... \
            ./runtime/...
          tar -czf docs-${{ github.ref_name }}.tar.gz docs/code/
          echo "docs tarball: $(du -sh docs-${{ github.ref_name }}.tar.gz | cut -f1)"

      # ── Upload bundles as artifacts ───────────
      - name: Upload vendor snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-snapshot-${{ github.ref_name }}
          path: vendor-snapshot-${{ github.ref_name }}.tar.gz
          retention-days: 90

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ github.ref_name }}
          path: docs-${{ github.ref_name }}.tar.gz
          retention-days: 90

  # ─────────────────────────────────────────────
  # Job 2: Release
  # Generates changelog and release notes, then
  # publishes the GitHub Release with all bundles
  # attached as release assets.
  # ─────────────────────────────────────────────
  release:
    name: Publish Release
    runs-on: self-hosted
    needs: bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Checkout main
        run: |
          git checkout main
          git pull origin main

      - name: Generate CHANGELOG.md
        run: git-cliff --config .cliff.toml --output CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog for ${{ github.ref_name }}" || echo "No changes"
          git push origin main

      - name: Generate release notes
        run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

      # ── Download bundles from bundle job ─────
      - name: Download vendor snapshot
        uses: actions/download-artifact@v4
        with:
          name: vendor-snapshot-${{ github.ref_name }}

      - name: Download docs
        uses: actions/download-artifact@v4
        with:
          name: docs-${{ github.ref_name }}

      # ── Publish release with assets ───────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            vendor-snapshot-${{ github.ref_name }}.tar.gz
            docs-${{ github.ref_name }}.tar.gz
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 📦 GitHub Release Published
          **Version:** \`${{ github.ref_name }}\`

          ## Completed
          - Generated CHANGELOG.md using git-cliff
          - Committed changelog updates to main
          - Generated release notes
          - Bundled vendor snapshot
          - Bundled code documentation
          - Published GitHub Release with assets

          ## Release Assets
          | Asset | Description |
          | --- | --- |
          | \`vendor-snapshot-${{ github.ref_name }}.tar.gz\` | Full vendor directory snapshot |
          | \`docs-${{ github.ref_name }}.tar.gz\` | Generated code documentation |
          | \`CHANGELOG.md\` | Full project changelog |

          ## Source Tag
          \`${{ github.ref_name }}\`
          EOF
