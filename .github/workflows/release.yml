# =============================================================================
# release.yml — Publish GitHub Release
#
# Fires on push of a v* tag. Reads the already-current CHANGELOG.md for
# release notes and publishes a GitHub Release.
#
# CHANGELOG.md itself is generated and committed by finalize-release.yml,
# synchronously, before it merges main back into develop -- doing it there
# instead of here closes a race where this workflow (triggered
# asynchronously by the tag push) used to commit the changelog to main
# after finalize-release.yml had already synced develop, leaving develop
# permanently missing that commit.
#
# Tag-triggered release pipeline for self-hosted runners. Uses direct binaries
# (Syft for SBOMs, Cosign for signatures) instead of container actions, bypassing
# Docker daemon constraints while preserving full Sigstore keyless OIDC signing
# and GitHub artifact attestation.
#
# Secrets required:
#   APP_ID, APP_PRIVATE_KEY — GitHub App credentials, exchanged for a
#   short-lived installation token, used to check out main and publish
#   the release.
# =============================================================================
name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write     # create the GitHub Release

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Generate release notes
        run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Publishing this release fires release-assets.yml, which bundles
          # every asset and then signs and attests all of them (sign-and-attest
          # job) before the releaser closes the Release issue (complete job).
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 📦 Release Published: ${{ github.ref_name }}

          Assets, SBOM, Cosign signatures and SLSA build-provenance attestations
          are attached by `release-assets.yml` (the `sign-and-attest` job), which
          fires on this release being published. The `complete` job then closes
          the Release issue once every asset is signed and attested.

          ## Verification
          - **Signature:** `cosign verify-blob --bundle <asset>.sigstore.json --certificate-identity-regexp ".*" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" <asset>`
          - **Provenance:** `gh attest verify <asset> --owner ${{ github.repository_owner }}`
          EOF
