name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install git-cliff
              run: |
                  curl -L https://github.com/orhun/git-cliff/releases/download/v2.4.0/git-cliff-2.4.0-x86_64-unknown-linux-gnu.tar.gz -o cliff.tar.gz
                  tar -xzf cliff.tar.gz
                  sudo mv git-cliff-2.4.0/git-cliff /usr/local/bin/git-cliff

            - name: Generate release notes
              run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  body_path: RELEASE_NOTES.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
