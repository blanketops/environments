# =============================================================================
# coverage.yml — BlanketOps Environments Coverage
#
# Mirrors the vendor restore pattern from ci.yml validate job exactly.
# docker pull + docker create + docker export | tar — no oras.
#
# Secrets required:
#   GH_PAT — GHCR pull + private module access
# =============================================================================
name: Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  VENDOR_IMAGE: ghcr.io/blanketops/environments/tools

jobs:
  coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/BlanketOps/*,github.com/blanketops/*
          go env -w GONOSUMDB=github.com/BlanketOps/*,github.com/blanketops/*
          go env -w GOPROXY=direct

      - name: Compute vendor tag from go.sum
        id: vendor
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Vendor tag: ${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: BlanketOps
          password: ${{ secrets.GH_PAT }}

      - name: Restore vendor from snapshot
        run: |
          IMAGE="${{ env.VENDOR_IMAGE }}:${{ steps.vendor.outputs.tag }}"
          echo "Restoring vendor from ${IMAGE}"
          docker pull "${IMAGE}"
          CONTAINER=$(docker create "${IMAGE}" /nonexistent)
          rm -rf ./vendor
          docker export "${CONTAINER}" | tar -xf - vendor/
          docker rm "${CONTAINER}"
          echo "vendor/ restored — $(find vendor -mindepth 1 -maxdepth 1 -type d | wc -l) packages"
          echo "modules.txt present: $(test -f vendor/modules.txt && echo yes || echo NO)"

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name "*.go" -not -path "./vendor/*"))
          if [ -n "${UNFORMATTED}" ]; then
            echo "The following files are not formatted:"
            echo "${UNFORMATTED}"
            exit 1
          fi
          echo "All files formatted correctly"

      - name: Run tests and generate coverage
        run: |
          go test -mod=vendor \
            -v \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Generate coverage HTML
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            coverage.out
            coverage.html
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          TOTAL=$(go tool cover -func=coverage.out 2>/dev/null | grep "^total" | awk '{print $3}' || echo "N/A")
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 📊 Coverage Report

          **Go Version:** \`$(grep '^go ' go.mod | awk '{print $2}')\`
          **Vendor Tag:** \`${{ steps.vendor.outputs.tag }}\`
          **Total Coverage:** \`${TOTAL}\`

          ## Package Coverage

          | Package | Coverage |
          | ------- | -------- |
          $(go tool cover -func=coverage.out 2>/dev/null | grep -v "^total" | awk '{
            pkg=$1; cov=$3;
            gsub(/github.com\/BlanketOps\/blanketops-environments\//, "", pkg);
            print "| " pkg " | " cov " |"
          }' || echo "| N/A | N/A |")
          EOF