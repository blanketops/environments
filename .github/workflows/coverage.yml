name: Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  VENDOR_IMAGE: ghcr.io/ntlaletsi70/blanketops-environments/vendor-snapshot

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Go version from go.mod
        id: goversion
        run: |
          FULL=$(grep '^go ' go.mod | awk '{print $2}')
          MINOR=$(echo "$FULL" | cut -d. -f1-2)
          echo "full=${FULL}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR}" >> $GITHUB_OUTPUT
          echo "Go version: ${FULL} → image tag: ${MINOR}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.goversion.outputs.minor }}
          cache: false

      - name: Compute vendor tag from go.sum
        id: vendor
        run: |
          TAG=$(sha256sum go.sum | awk '{print $1}' | cut -c1-12)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Vendor tag: ${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Restore vendor snapshot
        run: |
          TAG="${{ steps.vendor.outputs.tag }}"
          IMAGE="${{ env.VENDOR_IMAGE }}:${TAG}"
          if oras manifest fetch "${IMAGE}" > /dev/null 2>&1; then
            echo "Restoring vendor snapshot: ${TAG}"
            oras pull "${IMAGE}"
            echo "Vendor snapshot restored"
          else
            echo "No vendor snapshot found for tag ${TAG} — falling back to go mod vendor"
            go mod vendor
          fi

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "The following files are not formatted:"
            echo "${UNFORMATTED}"
            exit 1
          fi
          echo "All files formatted correctly"

      - name: Run tests and generate coverage
        run: |
          go test -v -mod=vendor \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Generate coverage HTML
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Generate coverage summary
        run: |
          echo "## 📊 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | grep -v "^total" | awk '{
            pkg=$1; cov=$3;
            gsub(/github.com\/ntlaletsi70\/blanketops-environments\//, "", pkg);
            print "| " pkg " | " cov " |"
          }' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(go tool cover -func=coverage.out | grep "^total" | awk '{print $3}')
          echo "**Total Coverage: ${TOTAL}**" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            coverage.out
            coverage.html
          retention-days: 14

      - name: Verify build
        run: go build -mod=vendor ./...