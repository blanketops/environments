# =============================================================================
# runner-warmup.yml — Keep self-hosted runners warm
# Runs every 30 min to prevent cold starts on EKS runners
# =============================================================================
name: Runner Warmup

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmup:
    name: Warmup Runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go (cached)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Warm Go module cache
        run: |
          go version
          go list -m all >/dev/null

      - name: Warm vendor restore
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          if hack/vendor-snapshot.sh exists "ghcr.io/blanketops/environments/tools" "${TAG}"; then
            hack/vendor-snapshot.sh restore "ghcr.io/blanketops/environments/tools" "${TAG}" || true
          fi

      - name: Log in to GHCR (cached auth)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "✅ Runner warmed up at $(date)"