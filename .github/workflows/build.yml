# =============================================================================
# build.yml — Fast Build Check
#
# Runs on every push, to every branch (ci.yml only fires on push to main and
# on pull_request, so feature-branch pushes otherwise get no signal). Just a
# compile check — no vendor snapshot, lint, or test. See ci.yml for the full
# validation pipeline.
#
# Secrets required:
#   GH_PAT — private module access
# =============================================================================

name: Build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/BlanketOps/*,github.com/blanketops/*

      - name: Build
        run: go build ./...

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && '✅ Build passed' || '❌ Build failed' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🔨 Fast Build Check

          **Status:** ${STATUS}
          **Go Version:** \`$(go version | awk '{print $3}')\`
          **Branch:** \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`
          EOF
