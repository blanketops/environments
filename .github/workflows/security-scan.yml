# =============================================================================
# govulncheck.yml — Vulnerability Scanning
#
# Runs govulncheck against the full dependency tree.
# Vendor is restored from the GHCR snapshot — no network fetches at scan time.
# Fires on push to main, pull requests, and weekly on Monday.
#
# vendor restore:
#   FROM scratch images have no default CMD — docker create requires a command
#   even though it is never executed. /nonexistent is used as the placeholder.
#   docker export | tar extracts vendor/ directly — no path nesting issues.
#   Three-tier fallback: tagged snapshot → latest → inline go mod vendor.
#
# Outputs:
#   - Text output for human-readable summary
#   - SARIF uploaded to GitHub Security tab
#
# Secrets required:
#   GH_PAT — GHCR pull + private module git config
# =============================================================================

name: Vulnerability Check

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 8 * * 1'  # weekly — Monday 08:00 UTC

permissions:
  contents: read
  # security-events: write  # re-enable when SARIF upload is active (requires GHAS)

env:
  REGISTRY: ghcr.io
  VENDOR_IMAGE: ghcr.io/${{ github.repository }}/tools

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go version from go.mod — never hardcoded.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/ntlaletsi70/*
          go env -w GONOSUMDB=github.com/ntlaletsi70/*
          go env -w GOPROXY=direct

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ntlaletsi70
          password: ${{ secrets.GH_PAT }}

      - name: Compute vendor tag from go.sum
        id: tag
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Vendor tag: ${TAG}"

      # Three-tier fallback:
      #   1. content-addressed tag (exact go.sum match)
      #   2. latest (most recent snapshot, may be slightly stale)
      #   3. inline go mod vendor (slow but always works)
      - name: Restore vendor from snapshot
        run: |
          IMAGE_TAG="${{ env.VENDOR_IMAGE }}:${{ steps.tag.outputs.tag }}"
          IMAGE_LATEST="${{ env.VENDOR_IMAGE }}:latest"
          rm -rf ./vendor

          if docker pull "${IMAGE_TAG}" 2>/dev/null; then
            echo "Restoring vendor from tagged snapshot: ${IMAGE_TAG}"
            CONTAINER=$(docker create "${IMAGE_TAG}" /nonexistent)
            docker export "${CONTAINER}" | tar -xf - vendor/
            docker rm "${CONTAINER}"
          elif docker pull "${IMAGE_LATEST}" 2>/dev/null; then
            echo "Tagged snapshot not found — restoring from latest: ${IMAGE_LATEST}"
            CONTAINER=$(docker create "${IMAGE_LATEST}" /nonexistent)
            docker export "${CONTAINER}" | tar -xf - vendor/
            docker rm "${CONTAINER}"
          else
            echo "No snapshot available — building vendor inline"
            go mod vendor
          fi

          echo "vendor/ ready — $(find vendor -mindepth 1 -maxdepth 1 -type d | wc -l) packages"
          echo "modules.txt present: $(test -f vendor/modules.txt && echo yes || echo NO)"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Text run — human-readable, drives the summary.
      # Allowed to fail so SARIF upload always runs.
      - name: Run govulncheck
        id: govulncheck
        env:
          GOFLAGS: -mod=vendor
        run: |
          govulncheck ./... 2>&1 | tee govulncheck.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # SARIF run — machine-readable for GitHub Security tab.
      # Runs even when text run finds vulnerabilities.
      - name: Run govulncheck (SARIF)
        env:
          GOFLAGS: -mod=vendor
        run: |
          govulncheck -format sarif ./... > govulncheck.sarif 2>/dev/null || true

      # SARIF upload disabled — requires GitHub Advanced Security (GHAS).
      # Enable when repo is public under the blanketops org.
      # - name: Upload SARIF to GitHub Security tab
      #   uses: github/codeql-action/upload-sarif@v4
      #   if: always()
      #   with:
      #     sarif_file: govulncheck.sarif
      #     category: govulncheck

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govulncheck-${{ github.sha }}
          path: |
            govulncheck.txt
            govulncheck.sarif
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          STATUS="${{ steps.govulncheck.outputs.exit_code == '0' && '✅ No vulnerabilities found' || '⚠️ Vulnerabilities detected' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🔍 Vulnerability Scan

          **Status:** ${STATUS}
          **Go Version:** \`$(go version | awk '{print $3}')\`
          **Vendor tag:** \`${{ steps.tag.outputs.tag }}\`
          **Tool:** \`govulncheck -mod=vendor ./...\`

          ## Results

          \`\`\`
          $(cat govulncheck.txt 2>/dev/null || echo "No output captured")
          \`\`\`

          > SARIF results uploaded to the [Security tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning).
          EOF

      # Fail the job after all reporting steps complete
      # so SARIF and artifacts are always captured.
      - name: Fail on vulnerabilities
        if: steps.govulncheck.outputs.exit_code != '0'
        run: |
          echo "govulncheck found vulnerabilities — see Security tab and artifacts"
          exit 1