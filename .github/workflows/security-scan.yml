# =============================================================================
# govulncheck.yml — Vulnerability Scanning
#
# Runs govulncheck against the full dependency tree.
# Vendor is restored from the GHCR snapshot — no network fetches at scan time.
# Fires on push to main, pull requests, and weekly on Monday.
#
# Secrets required:
#   GH_PAT — GHCR pull + private module git config
# =============================================================================

name: Vulnerability Check

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 8 * * 1'  # weekly — Monday 08:00 UTC

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  VENDOR_IMAGE: ghcr.io/${{ github.repository }}/vendor-snapshot

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go version from go.mod — never hardcoded.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/ntlaletsi70/*
          go env -w GONOSUMDB=github.com/ntlaletsi70/*
          go env -w GOPROXY=direct

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ntlaletsi70
          password: ${{ secrets.GH_PAT }}

      - name: Compute vendor tag from go.sum
        id: tag
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Vendor tag: ${TAG}"

      # Restore vendor from snapshot — govulncheck runs with -mod=vendor
      # so no private module network access is needed at scan time.
      - name: Restore vendor from snapshot
        run: |
          IMAGE_TAG="${{ env.VENDOR_IMAGE }}:${{ steps.tag.outputs.tag }}"
          IMAGE_LATEST="${{ env.VENDOR_IMAGE }}:latest"

          if docker pull "${IMAGE_TAG}" 2>/dev/null; then
            echo "Restoring vendor from tagged snapshot: ${IMAGE_TAG}"
            CONTAINER=$(docker create "${IMAGE_TAG}")
          elif docker pull "${IMAGE_LATEST}" 2>/dev/null; then
            echo "Tagged snapshot not found — restoring from latest: ${IMAGE_LATEST}"
            CONTAINER=$(docker create "${IMAGE_LATEST}")
          else
            echo "No snapshot available — building vendor inline"
            go mod vendor
            echo "vendor/ built inline"
            echo "VENDOR_BUILT_INLINE=true" >> "$GITHUB_ENV"
          fi

          if [[ -z "${VENDOR_BUILT_INLINE}" ]]; then
            docker cp "${CONTAINER}:/vendor" ./vendor
            docker rm "${CONTAINER}"
          fi

          echo "vendor/ ready — $(find vendor -mindepth 1 -maxdepth 1 -type d | wc -l) packages"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -mod=vendor ./...

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🔍 Vulnerability Scan

          **Go Version:** \`$(go version | awk '{print $3}')\`
          **Vendor tag:** \`${{ steps.tag.outputs.tag }}\`
          **Tool:** \`govulncheck -mod=vendor ./...\`
          EOF