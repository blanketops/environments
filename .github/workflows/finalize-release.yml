# =============================================================================
# finalize-release.yml — Merge, Tag, and Sync a Release
#
# Manually triggered. Merges release/{version} into main, tags it, syncs
# main back into develop, then deletes the release branch. Pushing the tag
# triggers the Release workflow (changelog + GitHub Release).
#
# Auth:
#   Uses the BlanketOps-Environments GitHub App instead of a personal-account
#   PAT for merge/push/branch-delete — see ci.yml's header for the reasoning.
#   GPG signing is unrelated and unchanged: the App token authenticates the
#   push, GPG_PRIVATE_KEY is what makes the merge commits and tag "Verified".
#
# Docs regeneration:
#   ci.yml's code-docs job also regenerates docs/code on every push to main,
#   but it runs as a separate, asynchronously-triggered workflow run. This
#   job used to merge main back into develop immediately after tagging,
#   which raced ahead of that async commit — develop never actually
#   received it, and drifted a little further from main's generated docs on
#   every release. The generate-and-commit steps below make this job
#   self-sufficient: docs are regenerated and committed to main
#   synchronously, before merging back into develop, so develop is always
#   caught up regardless of what ci.yml's code-docs job does on its own
#   schedule. Unlike that job, this one commits with plain `git commit` —
#   GPG signing is already configured globally by the Import GPG key step
#   above, so no Git Data API workaround is needed here.
#
# Changelog generation:
#   release.yml (triggered separately by the tag push below) used to
#   generate CHANGELOG.md and commit it to main itself — the same async
#   race as the docs one above, just for a different file. Generating and
#   committing it here instead, after tagging and before merging back into
#   develop, means develop is caught up on the changelog too, and
#   release.yml no longer needs to touch main at all — it just reads the
#   already-current CHANGELOG.md for its release notes.
#
# Secrets required:
#   APP_ID, APP_PRIVATE_KEY — GitHub App credentials
#   GPG_PRIVATE_KEY  — signs the merge commits and release tag
#   GPG_PASSPHRASE   — passphrase for GPG_PRIVATE_KEY
# =============================================================================

name: Finalize Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to finalize (e.g. v0.0.9)"
        required: true
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments,environments-api,environments-contract

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # v6 targets Node 20, which Actions now force-runs under a Node 24
      # shim — this intermittently broke gpg-agent's pinentry hand-off
      # during signing ("Inappropriate ioctl for device"). v7 runs
      # natively on Node 24, same inputs/outputs.
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_config_global: true
          git_committer_name: github-actions
          git_committer_email: actions@github.com

      - name: Merge release into main
        run: |
          git checkout main
          git pull origin main
          git merge --no-ff -S -m "release: merge release/${{ github.event.inputs.version }} into main" \
            origin/release/${{ github.event.inputs.version }}
          git push origin main

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/BlanketOps/*,github.com/blanketops/*
          go env -w GONOSUMDB=github.com/BlanketOps/*,github.com/blanketops/*
          go env -w GOPROXY=direct

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Generate code docs
        run: |
          mkdir -p docs/code
          gomarkdoc \
            --output 'docs/code/{{.Dir}}.md' \
            ./core/... \
            ./cache/... \
            ./logging/... \
            ./pkg/... \
            ./resolution/... \
            ./runtime/...

      - name: Commit and push code docs
        run: |
          git add docs/code/ -f
          if ! git diff-index --quiet HEAD; then
            git commit -S -m "docs: auto-generate code documentation [skip ci]"
            git push origin main
          else
            echo "No documentation changes to commit"
          fi

      - name: Tag release
        run: |
          git tag -s ${{ github.event.inputs.version }} -m "Release ${{ github.event.inputs.version }}"
          git push origin ${{ github.event.inputs.version }}

      - name: Install git-cliff
        run: |
          GITCLIFF_VERSION="2.13.0"
          curl -L "https://github.com/orhun/git-cliff/releases/download/v${GITCLIFF_VERSION}/git-cliff-${GITCLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
          tar xzf git-cliff.tar.gz
          sudo mv "git-cliff-${GITCLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          rm -rf git-cliff.tar.gz "git-cliff-${GITCLIFF_VERSION}"
          git-cliff --version

      - name: Generate CHANGELOG.md
        run: git-cliff --config .cliff.toml --output CHANGELOG.md

      - name: Commit and push changelog
        run: |
          git add CHANGELOG.md
          if ! git diff-index --quiet HEAD; then
            git commit -S -m "chore(release): update changelog for ${{ github.event.inputs.version }}"
            git push origin main
          else
            echo "No changelog changes to commit"
          fi

      - name: Merge main back into develop
        run: |
          git checkout develop
          git pull origin develop
          git merge --no-ff -S -m "chore: sync develop with main after release/${{ github.event.inputs.version }}" \
            origin/main
          git push origin develop

      - name: Delete release branch
        run: |
          git push origin --delete release/${{ github.event.inputs.version }}
      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🎉 Release Finalized

          **Version:** \`${{ github.event.inputs.version }}\`

          ## Completed

          - Merged \`release/${{ github.event.inputs.version }}\` into \`main\`
          - Created Git tag \`${{ github.event.inputs.version }}\`
          - Synced \`main\` back into \`develop\`
          - Deleted release branch

          ## Branch Flow

          release/${{ github.event.inputs.version }} → main → develop

          ## Next Steps

          - Pushing the tag triggers the **Release** workflow which generates the changelog and GitHub Release.
          EOF
