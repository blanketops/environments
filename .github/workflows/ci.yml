name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: write
jobs:
  validate:
    name: Lint, Vet, Test
    runs-on: self-hosted
    strategy:
      matrix:
        go-version: ["1.25.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Disable Go auto toolchain
        run: go env -w GOTOOLCHAIN=local

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/ntlaletsi70/*
          go env -w GONOSUMDB=github.com/ntlaletsi70/*
          go env -w GOPROXY=direct

      # Cache must be restored before any Go commands so tidy and build
      # hit the cache rather than the network.
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      - name: Tidy
        run: mage tidy

      - name: Auto-fix formatting
        run: gofmt -w .

      - name: Commit formatting and tidy fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format and tidy [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build
        run: mage build

      - name: Vet
        run: mage vet

      - name: Install staticcheck
        run: |
          if ! command -v staticcheck &> /dev/null; then
            go install honnef.co/go/tools/cmd/staticcheck@latest
          fi

      - name: Lint
        run: mage lint

      - name: Test
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Ensure coverage file exists
        run: test -f coverage.out

      - name: CI Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # ✅ Validation Complete
          **Go Version:** \`${{ matrix.go-version }}\`
          ## Checks Executed
          | Step | Tool |
          | --- | --- |
          | Dependency tidy | \`mage tidy\` |
          | Auto-format | \`gofmt\` |
          | Build | \`mage build\` |
          | Vet | \`mage vet\` |
          | Lint | \`mage lint\` (staticcheck) |
          | Test | \`go test\` |
          | Coverage | \`coverage.out\` |
          EOF
