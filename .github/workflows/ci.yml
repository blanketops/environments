# =============================================================================
# ci.yml — Blanketops Environments Library CI (Artifact-Free + Rich Summaries)
#
# Eight-job pipeline (merges the former ci.yml, build.yml, coverage.yml,
# code-docs.yml, fuzzing.yml, vendor-cleanup.yml):
#   0. changes         — lists the files a push or pull request changed and
#                        reports whether any of them is not documentation.
#                        build, vendor-snapshot, coverage and code-docs skip
#                        when none is (validate skips with vendor-snapshot).
#   1. build           — fast compile check on every push, any branch. Gives
#                        feature-branch pushes a quick signal without paying
#                        for the full vendor-snapshot/lint/test/coverage cost.
#   2. vendor-snapshot — builds and caches vendor/ as an OCI image in GHCR.
#                        Only rebuilds when go.sum changes (content-addressed
#                        by sha256 of go.sum). Runs on push to main + PRs only.
#   3. validate        — restores vendor/ from snapshot, runs lint/vet/test.
#                        No network at build time — vendor/ is authoritative.
#   4. coverage        — restores the same snapshot, runs gofmt + coverage.
#                        Runs on push to main/develop + PRs targeting main.
#   5. code-docs       — generates Go package docs via gomarkdoc and commits
#                        them back to docs/code/. Runs on push to main only.
#   6. fuzz            — runs the native Go fuzz targets (testing.F) added
#                        for the OpenSSF Scorecard Fuzzing check, one matrix
#                        leg per target. Runs on push to main, weekly
#                        schedule, or manual dispatch.
#   7. vendor-cleanup  — prunes old vendor-snapshot GHCR images past the 10
#                        most recent. Runs weekly, or manual dispatch.
# =============================================================================

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # vendor-cleanup — weekly Monday 06:00 UTC
    - cron: '0 9 * * 2' # fuzz — weekly Tuesday 09:00 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Duration to fuzz each target (go test -fuzztime value) — only used by the fuzz job'
        required: false
        default: '60s'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  VENDOR_IMAGE: ghcr.io/blanketops/environments/tools
  # test-helper (environments-bots) opens one tracking issue per test file and
  # posts each run's results. Pinned to the environments-bots commit that adds
  # the -tests-dir/-exclude flags (so it can track tests beside the source).
  TEST_HELPER_REF: 0a0a2216c78ac8d6458aa5d76d6c7570fc1c2a10

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 0: Changes
  # Scope: push or pull_request.
  # Outputs code=false only when every changed file is documentation; any
  # doubt (new branch, unreadable range, empty diff) leaves it true.
  # Workflow files are deliberately not documentation: a change under
  # .github/workflows/ must still run the pipeline.
  # ───────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: self-hosted
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          DOCS='^(.*\.md|\.claude/.*|docs/.*|LICENSE|\.gitignore|\.github/ISSUE_TEMPLATE/.*)$'
          ZERO=0000000000000000000000000000000000000000

          code=true
          reason=""
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="HEAD^1 HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            reason="new branch, nothing to compare against"
          else
            range="$BEFORE $SHA"
          fi

          if [ -n "$range" ]; then
            if files=$(git diff --name-only $range 2>/dev/null) && [ -n "$files" ]; then
              other=$(printf '%s\n' "$files" | grep -vE "$DOCS" || true)
              total=$(printf '%s\n' "$files" | wc -l | tr -d ' ')
              if [ -z "$other" ]; then
                code=false
                reason="all $total changed files are documentation"
              else
                reason="$(printf '%s\n' "$other" | wc -l | tr -d ' ') of $total changed files are not documentation"
              fi
            else
              reason="could not list changed files"
            fi
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          RESULT="${{ steps.detect.outputs.code == 'false' && 'Documentation only — build, vendor, lint, test and coverage jobs are skipped' || 'Code changed — full pipeline runs' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Change Detection
          **Result:** ${RESULT}
          **Reason:** ${{ steps.detect.outputs.reason || 'detection did not complete' }}
          **Event:** \`${{ github.event_name }}\`
          **Commit:** \`${{ github.sha }}\`
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Build
  # Original scope: push, every branch, no pull_request trigger.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: self-hosted
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        run: go build ./...

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && '✅ Build passed' || '❌ Build failed' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🔨 Fast Build Check
          **Status:** ${STATUS}
          **Go Version:** \`$(go version | awk '{print $3}')\`
          **Branch:** \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Vendor Snapshot
  # Original scope: push to main, or any pull_request.
  # Builds and pushes the vendor image only when go.sum has changed.
  # ───────────────────────────────────────────────────────────────────────────
  vendor-snapshot:
    name: Vendor Snapshot
    runs-on: self-hosted
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false' &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    outputs:
      vendor-tag: ${{ steps.tag.outputs.tag }}
      cache-hit: ${{ steps.check.outputs.hit }}
      go-minor: ${{ steps.goversion.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Go version from go.mod
        id: goversion
        run: |
          FULL=$(grep '^go ' go.mod | awk '{print $2}')
          MINOR=$(echo "${FULL}" | cut -d. -f1,2)
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Compute vendor tag from go.sum
        id: tag
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if vendor snapshot already exists
        id: check
        run: |
          if hack/vendor-snapshot.sh exists "${{ env.VENDOR_IMAGE }}" "${{ steps.tag.outputs.tag }}"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.check.outputs.hit == 'false'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.goversion.outputs.full }}
          cache: false

      - name: Vendor dependencies
        if: steps.check.outputs.hit == 'false'
        run: go mod vendor

      - name: Build and push vendor snapshot
        if: steps.check.outputs.hit == 'false'
        run: hack/vendor-snapshot.sh push "${{ env.VENDOR_IMAGE }}" "${{ steps.tag.outputs.tag }}" latest

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && '✅ Vendor snapshot ready' || '❌ Vendor snapshot failed' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 📦 Vendor Snapshot
          **Status:** ${STATUS}
          **Tag:** \`${{ steps.tag.outputs.tag }}\`
          **Cache Hit:** \`${{ steps.check.outputs.hit }}\`
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Validate
  # Restores vendor/ from the snapshot image then runs the full pipeline.
  # Skips automatically whenever vendor-snapshot skips (needs:).
  # ───────────────────────────────────────────────────────────────────────────
  validate:
    name: Lint, Vet, Test
    runs-on: self-hosted
    needs: vendor-snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore vendor from snapshot
        run: hack/vendor-snapshot.sh restore "${{ env.VENDOR_IMAGE }}" "${{ needs.vendor-snapshot.outputs.vendor-tag }}"

      - name: Build + Vet
        id: build
        continue-on-error: true
        run: |
          go build -mod=vendor ./...
          go vet -mod=vendor ./...

      - name: Rebuild vendor (stale snapshot detected)
        if: steps.build.outcome == 'failure'
        run: |
          go env -w GOPROXY=https://proxy.golang.org,direct
          go mod vendor

      - name: Push corrected vendor snapshot
        if: steps.build.outcome == 'failure'
        run: hack/vendor-snapshot.sh push "${{ env.VENDOR_IMAGE }}" "${{ needs.vendor-snapshot.outputs.vendor-tag }}" latest

      - name: Build + Vet (retry)
        if: steps.build.outcome == 'failure'
        run: |
          go build -mod=vendor ./...
          go vet -mod=vendor ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          skip-cache: true
          args: --timeout=5m

      - name: Test
        run: go test -mod=vendor ./...

      - name: Summary
        if: always()
        run: |
          VENDOR_STATUS="${{ needs.vendor-snapshot.outputs.cache-hit == 'true' && '✅ Cache hit' || '🔨 Rebuilt' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # ✅ Validation Complete

          **Go Version:** \`${{ needs.vendor-snapshot.outputs.go-minor }}\`

          ## Vendor Snapshot
          | Key | Value |
          | --- | --- |
          | Tag | \`${{ needs.vendor-snapshot.outputs.vendor-tag }}\` |
          | Status | ${VENDOR_STATUS} |
          | Image | \`${{ env.VENDOR_IMAGE }}\` |

          ## Checks Executed
          | Step | Tool |
          | --- | --- |
          | Build | \`go build -mod=vendor\` |
          | Vet | \`go vet -mod=vendor\` |
          | Lint | \`golangci-lint\` |
          | Test | \`go test -mod=vendor\` |
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4: Coverage
  # Original scope: push to main or develop, or a pull_request targeting main.
  # ───────────────────────────────────────────────────────────────────────────
  coverage:
    name: Test and Coverage
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read      # restore the vendor snapshot from GHCR
      issues: write       # test-helper fallback (GITHUB_TOKEN) can open issues
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false' &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Compute vendor tag from go.sum
        id: vendor
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore vendor from snapshot
        run: hack/vendor-snapshot.sh restore "${{ env.VENDOR_IMAGE }}" "${{ steps.vendor.outputs.tag }}"

      - name: Run tests, coverage and JSON log
        id: test
        run: |
          set +e
          go test -mod=vendor -json -coverprofile=coverage.out -covermode=atomic ./... \
            > "${RUNNER_TEMP}/go-test.json"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          echo "failed test events: $(grep -c '\"Action\":\"fail\"' "${RUNNER_TEMP}/go-test.json" 2>/dev/null || echo 0)"
          exit 0

      - name: Coverage Summary
        if: always()
        run: |
          TOTAL=$(go tool cover -func=coverage.out 2>/dev/null | grep "^total" | awk '{print $3}' || echo "N/A")

          PKG_ROWS=$(awk '
            NR==1 { next }
            {
              split($1, fp, ":")
              n = split(fp[1], dirs, "/")
              pkg = ""
              for (i = 1; i < n; i++) pkg = pkg (i > 1 ? "/" : "") dirs[i]
              total[pkg] += $2
              if ($3 > 0) covered[pkg] += $2
            }
            END {
              for (p in total) {
                pct = (total[p] > 0) ? (covered[p] / total[p] * 100) : 0
                printf "%.1f\t%s\n", pct, p
              }
            }
          ' coverage.out 2>/dev/null | sort -n)

          PKG_COUNT=$(echo "${PKG_ROWS}" | grep -c . || echo 0)

          TABLE=$(echo "${PKG_ROWS}" | awk -F'\t' '{
            pkg=$2; gsub(/github.com\/blanketops\/environments\//, "", pkg);
            printf "| %s | %.1f%% |\n", pkg, $1
          }')

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 📊 Coverage Report

          **Go Version:** \`$(grep '^go ' go.mod | awk '{print $2}')\`
          **Vendor Tag:** \`${{ steps.vendor.outputs.tag }}\`
          **Total Coverage:** \`${TOTAL}\`

          <details>
          <summary>Package coverage (${PKG_COUNT} packages, weakest first)</summary>

          | Package | Coverage |
          | ------- | -------- |
          ${TABLE}

          </details>
          EOF

      # One tracking issue per test file, then this run's per-file results
      # posted to them — the same flow environments-tests uses, so every unit
      # test is visible on the board as we drive to 100% before 1.0.0. All
      # best-effort: a fork PR has no bot token, and this must never fail CI.
      - name: Install test-helper
        id: test-helper
        if: always()
        continue-on-error: true
        run: |
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/blanketops/environments-bots/cmd/test-helper@${TEST_HELPER_REF}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Mint the developer bot's token
        id: bot-token
        if: always() && steps.test-helper.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEVELOPER_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments

      - name: Open an issue per test file
        if: always() && steps.test-helper.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          PROJECT: ${{ steps.bot-token.outputs.token && 'blanketops/1' || '' }}
          SOURCE: ${{ github.event.pull_request.html_url || github.event.head_commit.url }}
        run: test-helper sync -tests-dir . -exclude vendor -source "$SOURCE" ${PROJECT:+-project "$PROJECT"}

      - name: Post test results to the issues
        if: always() && steps.test-helper.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
          REF: "${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
        run: test-helper report -tests-dir . -exclude vendor -go-json "${RUNNER_TEMP}/go-test.json" -ref "$REF"

      - name: Fail the job if tests failed
        if: always()
        run: |
          code='${{ steps.test.outputs.exit }}'
          if [ "$code" != "0" ]; then
            echo "::error::go test failed (exit ${code})"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Job 5: Code Docs
  # Original scope: push to main only.
  # ───────────────────────────────────────────────────────────────────────────
  code-docs:
    name: Generate Code Docs
    runs-on: self-hosted
    concurrency:
      group: code-docs
      cancel-in-progress: false
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Generate docs
        run: |
          mkdir -p docs/code
          gomarkdoc --output 'docs/code/{{.Dir}}.md' ./core/... ./cache/... ./logging/... ./pkg/... ./resolution/... ./runtime/...

      - name: Commit docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          hack/api-pr.sh main "docs/code-${GITHUB_SHA::7}" "docs: auto-generate code documentation [skip ci]" docs/code/

      - name: Build summary
        if: always()
        run: |
          echo "## 📚 Code Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated from commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for group in core cache logging pkg resolution runtime; do
            files=$(find docs/code -name "*.md" | grep "/${group}" | sort)
            if [ -n "$files" ]; then
              echo "### \`${group}/\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              for f in $files; do
                pkg=$(basename "$f" .md)
                echo "- \`${pkg}\`" >> $GITHUB_STEP_SUMMARY
              done
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # ───────────────────────────────────────────────────────────────────────────
  # Job 6: Fuzz
  # Original scope: push to main, weekly schedule, or manual dispatch.
  # ───────────────────────────────────────────────────────────────────────────
  fuzz:
    name: Fuzz (${{ matrix.target.name }})
    runs-on: self-hosted
    if: (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 2') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: FuzzResolveBuild
            pkg: ./resolution/build/resolve/...
          - name: FuzzResolveDeployment
            pkg: ./resolution/deployment/resolve/...
          - name: FuzzResolveDomain
            pkg: ./resolution/domain/resolve/...
          - name: FuzzResolveEnvironment
            pkg: ./resolution/environment/resolve/...
          - name: FuzzResolveGitHubEvent
            pkg: ./resolution/githubevent/resolve/...
          - name: FuzzResolveGitRepository
            pkg: ./resolution/gitrepository/resolve/...
          - name: FuzzResolvePackage
            pkg: ./resolution/packages/resolve/...
          - name: FuzzResolveRoute
            pkg: ./resolution/route/resolve/...
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore vendor from snapshot
        run: |
          # fuzz runs on schedule/dispatch, when the vendor-snapshot job does
          # not run, so restore the snapshot self-contained (tag = sha256 of
          # go.sum), falling back to `go mod vendor` if it is missing.
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          hack/vendor-snapshot.sh restore "${{ env.VENDOR_IMAGE }}" "${TAG}" || go mod vendor

      - name: Run Fuzz Target
        run: go test -mod=vendor "${{ matrix.target.pkg }}" -run="${{ matrix.target.name }}" -fuzz="${{ matrix.target.name }}" -fuzztime="${{ github.event.inputs.fuzztime || '60s' }}" -v

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && '✅ No crashers found' || '❌ Crasher found' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🧪 Fuzzing — ${{ matrix.target.name }}
          **Status:** ${STATUS}
          **Duration:** \`${{ github.event.inputs.fuzztime || '60s' }}\`
          **Package:** \`${{ matrix.target.pkg }}\`
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 7: Vendor Cleanup
  # Original scope: weekly schedule, or manual dispatch.
  # ───────────────────────────────────────────────────────────────────────────
  vendor-cleanup:
    name: Vendor Snapshot Cleanup
    runs-on: self-hosted
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old snapshots
        run: hack/vendor-snapshot.sh prune "${{ env.VENDOR_IMAGE }}" 10

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🧹 Vendor Snapshot Cleanup
          Pruned old GHCR snapshots retaining the 10 most recent.
          EOF
