# =============================================================================
# ci.yml — Blanketops Environments Library CI (Artifact-Free Edition)
# =============================================================================

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # vendor-cleanup — weekly Monday 06:00 UTC
    - cron: '0 9 * * 2' # fuzz — weekly Tuesday 09:00 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Duration to fuzz each target (go test -fuzztime value)'
        required: false
        default: '60s'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  VENDOR_IMAGE: ghcr.io/blanketops/environments/tools

jobs:
  changes:
    name: Detect Changes
    runs-on: self-hosted
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-documentation changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          DOCS='^(.*\.md|\.claude/.*|docs/.*|LICENSE|\.gitignore|\.github/ISSUE_TEMPLATE/.*)$'
          ZERO=0000000000000000000000000000000000000000

          code=true
          reason=""
          range=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="HEAD^1 HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
            reason="new branch, nothing to compare against"
          else
            range="$BEFORE $SHA"
          fi

          if [ -n "$range" ]; then
            if files=$(git diff --name-only $range 2>/dev/null) && [ -n "$files" ]; then
              other=$(printf '%s\n' "$files" | grep -vE "$DOCS" || true)
              total=$(printf '%s\n' "$files" | wc -l | tr -d ' ')
              if [ -z "$other" ]; then
                code=false
                reason="all $total changed files are documentation"
              else
                reason="$(printf '%s\n' "$other" | wc -l | tr -d ' ') of $total changed files are not documentation"
              fi
            else
              reason="could not list changed files"
            fi
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          RESULT="${{ steps.detect.outputs.code == 'false' && 'Documentation only — build, vendor, lint, test and coverage jobs are skipped' || 'Code changed — full pipeline runs' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # Change Detection
          **Result:** ${RESULT}
          **Reason:** ${{ steps.detect.outputs.reason || 'detection did not complete' }}
          EOF

  build:
    name: Build
    runs-on: self-hosted
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'push' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: go build ./...

  vendor-snapshot:
    name: Vendor Snapshot
    runs-on: self-hosted
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false' &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    outputs:
      vendor-tag: ${{ steps.tag.outputs.tag }}
      cache-hit: ${{ steps.check.outputs.hit }}
      go-minor: ${{ steps.goversion.outputs.minor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract Go version from go.mod
        id: goversion
        run: |
          FULL=$(grep '^go ' go.mod | awk '{print $2}')
          MINOR=$(echo "${FULL}" | cut -d. -f1,2)
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
      - name: Compute vendor tag from go.sum
        id: tag
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if vendor snapshot already exists
        id: check
        run: |
          if hack/vendor-snapshot.sh exists "${{ env.VENDOR_IMAGE }}" "${{ steps.tag.outputs.tag }}"; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Go
        if: steps.check.outputs.hit == 'false'
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.goversion.outputs.full }}
          cache: false
      - name: Vendor dependencies
        if: steps.check.outputs.hit == 'false'
        run: go mod vendor
      - name: Build and push vendor snapshot
        if: steps.check.outputs.hit == 'false'
        run: hack/vendor-snapshot.sh push "${{ env.VENDOR_IMAGE }}" "${{ steps.tag.outputs.tag }}" latest

  validate:
    name: Lint, Vet, Test
    runs-on: self-hosted
    needs: vendor-snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore vendor from snapshot
        run: hack/vendor-snapshot.sh restore "${{ env.VENDOR_IMAGE }}" "${{ needs.vendor-snapshot.outputs.vendor-tag }}"
      - name: Build + Vet
        id: build
        continue-on-error: true
        run: |
          go build -mod=vendor ./...
          go vet -mod=vendor ./...
      - name: Rebuild vendor (stale snapshot detected)
        if: steps.build.outcome == 'failure'
        run: |
          go env -w GOPROXY=https://proxy.golang.org,direct
          go mod vendor
      - name: Push corrected vendor snapshot
        if: steps.build.outcome == 'failure'
        run: hack/vendor-snapshot.sh push "${{ env.VENDOR_IMAGE }}" "${{ needs.vendor-snapshot.outputs.vendor-tag }}" latest
      - name: Build + Vet (retry)
        if: steps.build.outcome == 'failure'
        run: |
          go build -mod=vendor ./...
          go vet -mod=vendor ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-mode: none
          skip-cache: true
          args: --timeout=5m
      - name: Test
        run: go test -mod=vendor ./... -coverprofile=coverage.out -covermode=atomic

  coverage:
    name: Test and Coverage
    runs-on: self-hosted
    needs: changes
    if: >-
      ${{ !cancelled() && needs.changes.outputs.code != 'false' &&
      ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Compute vendor tag from go.sum
        id: vendor
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore vendor from snapshot
        run: hack/vendor-snapshot.sh restore "${{ env.VENDOR_IMAGE }}" "${{ steps.vendor.outputs.tag }}"
      - name: Run tests and generate coverage
        run: go test -mod=vendor -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: Summary Report Only
        if: always()
        run: echo "Coverage computed successfully; artifact upload omitted for self-hosted stability." >> $GITHUB_STEP_SUMMARY

  code-docs:
    name: Generate Code Docs
    runs-on: self-hosted
    concurrency:
      group: code-docs
      cancel-in-progress: false
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest
      - name: Generate docs
        run: |
          mkdir -p docs/code
          gomarkdoc --output 'docs/code/{{.Dir}}.md' ./core/... ./cache/... ./logging/... ./pkg/... ./resolution/... ./runtime/...
      - name: Commit docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          hack/api-pr.sh main "docs/code-${GITHUB_SHA::7}" "docs: auto-generate code documentation [skip ci]" docs/code/

  fuzz:
    name: Fuzz (${{ matrix.target.name }})
    runs-on: self-hosted
    if: (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 2') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: FuzzResolveBuild
            pkg: ./resolution/build/resolve/...
          - name: FuzzResolveDeployment
            pkg: ./resolution/deployment/resolve/...
          - name: FuzzResolveDomain
            pkg: ./resolution/domain/resolve/...
          - name: FuzzResolveEnvironment
            pkg: ./resolution/environment/resolve/...
          - name: FuzzResolveGitHubEvent
            pkg: ./resolution/githubevent/resolve/...
          - name: FuzzResolveGitRepository
            pkg: ./resolution/gitrepository/resolve/...
          - name: FuzzResolvePackage
            pkg: ./resolution/packages/resolve/...
          - name: FuzzResolveRoute
            pkg: ./resolution/route/resolve/...
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run Fuzz Target
        run: go test -mod=vendor "${{ matrix.target.pkg }}" -run="${{ matrix.target.name }}" -fuzz="${{ matrix.target.name }}" -fuzztime="${{ github.event.inputs.fuzztime || '60s' }}" -v

  vendor-cleanup:
    name: Vendor Snapshot Cleanup
    runs-on: self-hosted
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prune old snapshots
        run: hack/vendor-snapshot.sh prune "${{ env.VENDOR_IMAGE }}" 10
