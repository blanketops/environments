name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Vet, Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ["1.22.1", "1.23.1", "1.25.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # 🔐 Configure access to private modules (PAT-based)
      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/ntlaletsi70/*
          go env -w GONOSUMDB=github.com/ntlaletsi70/*
          go env -w GOPROXY=direct

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run tests
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Ensure coverage file exists
        run: test -f coverage.out
