# =============================================================================
# ci.yml — Blanketops Environments Library CI
#
# Seven-job pipeline (merges the former ci.yml, build.yml, coverage.yml,
# code-docs.yml, fuzzing.yml, vendor-cleanup.yml):
#   1. build           — fast compile check on every push, any branch. Gives
#                         feature-branch pushes a quick signal without paying
#                         for the full vendor-snapshot/lint/test/coverage cost.
#   2. vendor-snapshot  — builds and caches vendor/ as an OCI image in GHCR.
#                         Only rebuilds when go.sum changes (content-addressed
#                         by sha256 of go.sum). Runs on push to main + PRs only.
#   3. validate         — restores vendor/ from snapshot, runs lint/vet/test.
#                         No network at build time — vendor/ is authoritative.
#   4. coverage         — restores the same snapshot, runs gofmt + coverage.
#                         Runs on push to main/develop + PRs targeting main.
#   5. code-docs        — generates Go package docs via gomarkdoc and commits
#                         them back to docs/code/. Runs on push to main only.
#   6. fuzz             — runs the native Go fuzz targets (testing.F) added
#                         for the OpenSSF Scorecard Fuzzing check, one matrix
#                         leg per target. Runs on push to main, weekly
#                         schedule, or manual dispatch.
#   7. vendor-cleanup   — prunes old vendor-snapshot GHCR images past the 10
#                         most recent. Runs weekly, or manual dispatch.
#
# Each job below carries its own trigger scope forward from the file it was
# merged from via an `if:` gate, rather than broadening every job to the
# combined (union) top-level trigger — see each job's gate for its original
# scope. Gates that only checked `github.ref` (not also `github.event_name`)
# were tightened when schedule/workflow_dispatch triggers were added to this
# file's `on:` — a `schedule` event's `github.ref` is the default branch too,
# so an ungated ref check would spuriously fire push/PR-only jobs on every
# scheduled run.
#
# fuzz and vendor-cleanup share this file's single `workflow_dispatch`
# trigger — a manual "Run workflow" click runs both (each is a harmless,
# idempotent maintenance job on its own, so this coupling is a deliberate
# simplification, not an oversight).
#
# Go version:
#   Extracted from go.mod at runtime — never hardcoded in this file.
#   Passed as GO_VERSION build-arg to tools/Dockerfile.
#
# vendor restore:
#   FROM scratch images have no default CMD — docker create requires a command
#   even though it is never executed. /nonexistent is used as the placeholder.
#   docker export | tar extracts vendor/ directly — no path nesting issues.
#
# Auth:
#   Private-module git config (environments-api, environments-contract) uses
#   the BlanketOps-Environments GitHub App (via actions/create-github-app-token)
#   instead of a personal-account PAT — installation tokens are minted fresh
#   per job and expire in an hour, instead of a PAT's expiry silently lapsing.
#
#   GHCR push/pull uses GITHUB_TOKEN, not the App token — the App installation
#   token was denied "Write organization package" against this GHCR package
#   regardless of what permission was granted (repository Packages,
#   organization Packages, explicit per-package "Manage Actions access"
#   linkage — same denial every time). GITHUB_TOKEN is scoped to this repo
#   only, which is exactly what a same-repo package push/pull needs.
#
#   code-docs's generated-docs commit is built directly through the Git Data
#   API (blob/tree/commit/ref) using the App's installation token, not `git
#   commit` — commits made this way show as "Verified" automatically, so
#   there's no GPG key to hold, rotate, or lose.
#
# Secrets required:
#   APP_ID, APP_PRIVATE_KEY — GitHub App credentials, exchanged for a
#   short-lived installation token per job (private-module access only).
#   The App's "Contents" repository permission must be Read & write for the
#   code-docs job's Git Data API calls to succeed.
# =============================================================================

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # vendor-cleanup — weekly Monday 06:00 UTC
    - cron: '0 9 * * 2' # fuzz — weekly Tuesday 09:00 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Duration to fuzz each target (go test -fuzztime value) — only used by the fuzz job'
        required: false
        default: '60s'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  VENDOR_IMAGE: ghcr.io/blanketops/environments/tools

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # Job 1: Build (from build.yml)
  # Original scope: push, every branch, no pull_request trigger.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments,environments-api,environments-contract

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/BlanketOps/*,github.com/blanketops/*

      - name: Build
        run: go build ./...

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && '✅ Build passed' || '❌ Build failed' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🔨 Fast Build Check

          **Status:** ${STATUS}
          **Go Version:** \`$(go version | awk '{print $3}')\`
          **Branch:** \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 2: Vendor Snapshot
  # Original scope: push to main, or any pull_request.
  # Builds and pushes the vendor image only when go.sum has changed.
  # ───────────────────────────────────────────────────────────────────────────
  vendor-snapshot:
    name: Vendor Snapshot
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    outputs:
      vendor-tag: ${{ steps.tag.outputs.tag }}
      cache-hit: ${{ steps.check.outputs.hit }}
      go-minor: ${{ steps.goversion.outputs.minor }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments,environments-api,environments-contract

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Extract Go version from go.mod
        id: goversion
        run: |
          FULL=$(grep '^go ' go.mod | awk '{print $2}')
          MINOR=$(echo "${FULL}" | cut -d. -f1,2)
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "Go version: ${FULL} → image tag: ${MINOR}"

      - name: Compute vendor tag from go.sum
        id: tag
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Vendor tag: ${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if vendor snapshot already exists
        id: check
        run: |
          if docker manifest inspect ${{ env.VENDOR_IMAGE }}:${{ steps.tag.outputs.tag }} > /dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Vendor snapshot exists — skipping build"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot found — will build"
          fi

      - name: Configure Git for private modules
        if: steps.check.outputs.hit == 'false'
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        if: steps.check.outputs.hit == 'false'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.goversion.outputs.full }}

      - name: Vendor dependencies
        if: steps.check.outputs.hit == 'false'
        run: go mod vendor

      - name: Build and push vendor snapshot
        if: steps.check.outputs.hit == 'false'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          file: tools/Dockerfile
          push: true
          tags: |
            ${{ env.VENDOR_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.VENDOR_IMAGE }}:latest
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.minor }}

      # Build provenance attestation — disabled. Artifact attestations require
      # a public repo or a GitHub Team/Enterprise plan; this repo is private.
      # Also needs `permissions: attestations: write` and `id-token: write`
      # on the job. Re-enable if the plan/visibility changes.
      # - name: Attest vendor image provenance
      #   if: steps.check.outputs.hit == 'false'
      #   uses: actions/attest-build-provenance@v1
      #   with:
      #     subject-name: ${{ env.VENDOR_IMAGE }}
      #     subject-digest: ${{ steps.push.outputs.digest }}
      #     push-to-registry: true

  # ───────────────────────────────────────────────────────────────────────────
  # Job 3: Validate
  # Restores vendor/ from the snapshot image then runs the full pipeline.
  # go mod tidy and go mod vendor are NOT run here — snapshot is authoritative.
  # Skips automatically whenever vendor-snapshot skips (needs:).
  # ───────────────────────────────────────────────────────────────────────────
  validate:
    name: Lint, Vet, Test
    runs-on: ubuntu-latest
    needs: vendor-snapshot
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments,environments-api,environments-contract

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/BlanketOps/*,github.com/blanketops/*
          go env -w GONOSUMDB=github.com/BlanketOps/*,github.com/blanketops/*
          go env -w GOPROXY=direct

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore vendor from snapshot
        run: |
          IMAGE="${{ env.VENDOR_IMAGE }}:${{ needs.vendor-snapshot.outputs.vendor-tag }}"
          echo "Restoring vendor from ${IMAGE}"
          docker pull "${IMAGE}"
          CONTAINER=$(docker create "${IMAGE}" /nonexistent)
          rm -rf ./vendor
          docker export "${CONTAINER}" | tar -xf - vendor/
          docker rm "${CONTAINER}"
          echo "vendor/ restored — $(find vendor -mindepth 1 -maxdepth 1 -type d | wc -l) packages"
          echo "modules.txt present: $(test -f vendor/modules.txt && echo yes || echo NO)"

      # go.sum only changes when a required module's version changes — adding
      # a new import of an already-required module's not-yet-vendored
      # subpackage (e.g. a test newly importing .../client/fake) leaves
      # go.sum untouched, so the sha256(go.sum) cache tag never busts and a
      # snapshot built before that import existed is silently reused forever.
      # This step catches that case directly instead of failing deep inside
      # Test with an opaque "import lookup disabled by -mod=vendor" error.
      #
      # Must include `go vet`, not just `go build` — build does not
      # type-check _test.go files, and the missing-subpackage case above is
      # exactly the kind of import that only ever appears in a test file. A
      # build-only probe would report "complete" while vet (and test) still
      # fail on the same stale vendor.
      - name: Build + Vet
        id: build
        continue-on-error: true
        run: |
          go build -mod=vendor ./...
          go vet -mod=vendor ./...

      - name: Rebuild vendor (stale snapshot detected)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::warning::Restored vendor snapshot (tag ${{ needs.vendor-snapshot.outputs.vendor-tag }}) is incomplete — rebuilding locally and pushing a corrected snapshot."
          # This job's earlier GOPROXY=direct is fine for restore-only runs,
          # but a full `go mod vendor` (needed here) can hit vanity import
          # paths (e.g. honnef.co/go/tools) that time out under direct
          # fetch. vendor-snapshot — the job actually designed to run a full
          # vendor — never sets GOPROXY at all; match its (more robust,
          # proxy-first) default here instead of inheriting the override.
          go env -w GOPROXY=https://proxy.golang.org,direct
          go mod vendor

      - name: Push corrected vendor snapshot
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          file: tools/Dockerfile
          push: true
          tags: |
            ${{ env.VENDOR_IMAGE }}:${{ needs.vendor-snapshot.outputs.vendor-tag }}
            ${{ env.VENDOR_IMAGE }}:latest

      - name: Build + Vet (retry after rebuild)
        if: steps.build.outcome == 'failure'
        run: |
          go build -mod=vendor ./...
          go vet -mod=vendor ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - name: Test
        run: go test -mod=vendor ./... -coverprofile=coverage.out -covermode=atomic

      - name: Ensure coverage file exists
        run: test -f coverage.out

      - name: CI Summary
        if: always()
        run: |
          VENDOR_STATUS="${{ needs.vendor-snapshot.outputs.cache-hit == 'true' && '✅ Cache hit' || '🔨 Rebuilt' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # ✅ Validation Complete

          **Go Version:** \`${{ needs.vendor-snapshot.outputs.go-minor }}\`

          ## Vendor Snapshot
          | Key | Value |
          | --- | --- |
          | Tag | \`${{ needs.vendor-snapshot.outputs.vendor-tag }}\` |
          | Status | ${VENDOR_STATUS} |
          | Image | \`${{ env.VENDOR_IMAGE }}\` |

          ## Checks Executed
          | Step | Tool |
          | --- | --- |
          | Build | \`go build -mod=vendor\` |
          | Vet | \`go vet -mod=vendor\` |
          | Lint | \`golangci-lint\` |
          | Test | \`go test -mod=vendor\` |
          | Coverage | \`coverage.out\` |
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 4: Coverage (from coverage.yml)
  # Original scope: push to main or develop, or a pull_request targeting main.
  # Mirrors the vendor restore pattern from validate exactly — separate
  # standalone restore (not needs: vendor-snapshot) since the original ran
  # independently and can target develop, which vendor-snapshot does not.
  # ───────────────────────────────────────────────────────────────────────────
  coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments,environments-api,environments-contract

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/BlanketOps/*,github.com/blanketops/*
          go env -w GONOSUMDB=github.com/BlanketOps/*,github.com/blanketops/*
          go env -w GOPROXY=direct

      - name: Compute vendor tag from go.sum
        id: vendor
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Vendor tag: ${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore vendor from snapshot
        run: |
          IMAGE="${{ env.VENDOR_IMAGE }}:${{ steps.vendor.outputs.tag }}"
          echo "Restoring vendor from ${IMAGE}"
          docker pull "${IMAGE}"
          CONTAINER=$(docker create "${IMAGE}" /nonexistent)
          rm -rf ./vendor
          docker export "${CONTAINER}" | tar -xf - vendor/
          docker rm "${CONTAINER}"
          echo "vendor/ restored — $(find vendor -mindepth 1 -maxdepth 1 -type d | wc -l) packages"
          echo "modules.txt present: $(test -f vendor/modules.txt && echo yes || echo NO)"

      # See the matching comment in the validate job: go.sum doesn't change
      # when a test newly imports a not-yet-vendored subpackage of an
      # already-required module, so the sha256(go.sum) cache tag can point
      # at a permanently-stale snapshot. Catch that here instead of failing
      # deep inside Test with an opaque "import lookup disabled" error.
      #
      # Must include `go vet`, not just `go build` — build does not
      # type-check _test.go files, and this class of staleness is exactly a
      # missing test-only import. Build-only would report "complete" while
      # the Test step right after still fails on the same stale vendor.
      - name: Verify vendor completeness
        id: vendor-check
        continue-on-error: true
        run: |
          go build -mod=vendor ./...
          go vet -mod=vendor ./...

      - name: Rebuild vendor (stale snapshot detected)
        if: steps.vendor-check.outcome == 'failure'
        run: |
          echo "::warning::Restored vendor snapshot (tag ${{ steps.vendor.outputs.tag }}) is incomplete — rebuilding locally and pushing a corrected snapshot."
          # See the matching comment in the validate job — reset GOPROXY off
          # the direct-fetch override before a full go mod vendor.
          go env -w GOPROXY=https://proxy.golang.org,direct
          go mod vendor

      - name: Push corrected vendor snapshot
        if: steps.vendor-check.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          file: tools/Dockerfile
          push: true
          tags: |
            ${{ env.VENDOR_IMAGE }}:${{ steps.vendor.outputs.tag }}
            ${{ env.VENDOR_IMAGE }}:latest

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name "*.go" -not -path "./vendor/*"))
          if [ -n "${UNFORMATTED}" ]; then
            echo "The following files are not formatted:"
            echo "${UNFORMATTED}"
            exit 1
          fi
          echo "All files formatted correctly"

      - name: Run tests and generate coverage
        run: |
          go test -mod=vendor \
            -v \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Generate coverage HTML
        run: go tool cover -html=coverage.out -o coverage.html

      # gocov's tagged releases (and current master, last touched 2024-10-11)
      # pin golang.org/x/tools@v0.13.0, which fails to compile under this
      # repo's Go toolchain (confirmed: same failure on a plain `go install`
      # and on master — this is stale upstream, not a version-pin mistake on
      # our side). Building from source with a forced newer x/tools is the
      # only way to get a working gocov binary here.
      - name: Build gocov (patched for this Go toolchain)
        run: |
          git clone --depth 1 --branch v1.2.1 https://github.com/axw/gocov.git /tmp/gocov-src
          cd /tmp/gocov-src
          go mod edit -replace golang.org/x/tools=golang.org/x/tools@v0.48.0
          go mod tidy
          go build -o "$(go env GOPATH)/bin/gocov" ./gocov

      - name: Install gocov-html
        run: go install github.com/matm/gocov-html/cmd/gocov-html@latest

      - name: Generate beauty coverage report
        run: gocov convert coverage.out | gocov-html > beauty-report.html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: coverage-report-${{ github.sha }}
          path: |
            coverage.out
            coverage.html
            beauty-report.html
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          TOTAL=$(go tool cover -func=coverage.out 2>/dev/null | grep "^total" | awk '{print $3}' || echo "N/A")

          # coverage.out is a per-statement profile (mode: atomic\nfile:line.col,line.col numStmt count),
          # not per-package — aggregate statement counts by package directory
          # instead of dumping go tool cover -func's one-row-per-function
          # output, which runs to hundreds of rows in a repo this size.
          PKG_ROWS=$(awk '
            NR==1 { next }
            {
              split($1, fp, ":")
              n = split(fp[1], dirs, "/")
              pkg = ""
              for (i = 1; i < n; i++) pkg = pkg (i > 1 ? "/" : "") dirs[i]
              total[pkg] += $2
              if ($3 > 0) covered[pkg] += $2
            }
            END {
              for (p in total) {
                pct = (total[p] > 0) ? (covered[p] / total[p] * 100) : 0
                printf "%.1f\t%s\n", pct, p
              }
            }
          ' coverage.out 2>/dev/null | sort -n)

          PKG_COUNT=$(echo "${PKG_ROWS}" | grep -c . || echo 0)

          TABLE=$(echo "${PKG_ROWS}" | awk -F'\t' '{
            pkg=$2; gsub(/github.com\/blanketops\/environments\//, "", pkg);
            printf "| %s | %.1f%% |\n", pkg, $1
          }')

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 📊 Coverage Report

          **Go Version:** \`$(grep '^go ' go.mod | awk '{print $2}')\`
          **Vendor Tag:** \`${{ steps.vendor.outputs.tag }}\`
          **Total Coverage:** \`${TOTAL}\`

          <details>
          <summary>Package coverage (${PKG_COUNT} packages, weakest first)</summary>

          | Package | Coverage |
          | ------- | -------- |
          ${TABLE}

          </details>

          > 📦 Download artifact \`coverage-report-${{ github.sha }}\` from this run for the full \`gocov-html\` report (\`beauty-report.html\`) with per-function detail, plus the raw \`coverage.out\`/\`coverage.html\`.
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 5: Code Docs (from code-docs.yml)
  # Original scope: push to main only.
  # ───────────────────────────────────────────────────────────────────────────
  code-docs:
    name: Generate Code Docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments,environments-api,environments-contract

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/BlanketOps/*,github.com/blanketops/*
          go env -w GONOSUMDB=github.com/BlanketOps/*,github.com/blanketops/*
          go env -w GOPROXY=direct

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Generate docs
        run: |
          mkdir -p docs/code
          gomarkdoc \
            --output 'docs/code/{{.Dir}}.md' \
            ./core/... \
            ./cache/... \
            ./logging/... \
            ./pkg/... \
            ./resolution/... \
            ./runtime/...

      # Builds the commit through the Git Data API instead of `git commit` —
      # see the header comment for why. git add/status here only compute
      # *which* paths changed; nothing is committed or pushed locally.
      - name: Commit and push docs via the Git Data API
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            execSync('git add docs/code/ -f');
            const status = execSync(
              'git status --porcelain --no-renames -- docs/code/',
              { encoding: 'utf8' }
            ).trim();

            if (!status) {
              core.info('No documentation changes to commit');
              return;
            }

            const changes = status.split('\n').map(line => ({
              indexStatus: line.slice(0, 2).trim(),
              path: line.slice(3),
            }));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'main';
            const message = 'docs: auto-generate code documentation [skip ci]';

            const tree = changes.map(({ indexStatus, path }) =>
              indexStatus === 'D'
                ? { path, mode: '100644', type: 'blob', sha: null }
                : { path, mode: '100644', type: 'blob', content: fs.readFileSync(path, 'utf8') }
            );

            // One retry: main may have moved between checkout and here.
            for (let attempt = 1; attempt <= 2; attempt++) {
              const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              const parentSha = ref.object.sha;
              const { data: parentCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha });

              const { data: newTree } = await github.rest.git.createTree({
                owner, repo, base_tree: parentCommit.tree.sha, tree,
              });

              const { data: newCommit } = await github.rest.git.createCommit({
                owner, repo, message, tree: newTree.sha, parents: [parentSha],
              });

              try {
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: newCommit.sha });
                core.info(`Committed ${changes.length} file(s) as ${newCommit.sha}`);
                break;
              } catch (err) {
                if (attempt === 2) throw err;
                core.warning(`updateRef failed (branch moved?), retrying once: ${err.message}`);
              }
            }

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: godoc-${{ github.sha }}
          path: docs/code/
          retention-days: 30

      - name: Build summary
        run: |
          echo "## 📚 Code Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated from commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for group in core cache logging pkg resolution runtime; do
            files=$(find docs/code -name "*.md" | grep "/${group}" | sort)
            if [ -n "$files" ]; then
              echo "### \`${group}/\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              for f in $files; do
                pkg=$(basename "$f" .md)
                echo "- \`${pkg}\`" >> $GITHUB_STEP_SUMMARY
              done
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "> 📦 Download artifact \`godoc-${{ github.sha }}\` from the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to browse all generated docs." >> $GITHUB_STEP_SUMMARY

  # ───────────────────────────────────────────────────────────────────────────
  # Job 6: Fuzz (from fuzzing.yml)
  # Original scope: push to main, weekly schedule, or manual dispatch.
  #
  # Runs the native Go fuzz targets (testing.F) added for the OpenSSF
  # Scorecard Fuzzing check — every Resolve{Build,Deployment,Domain,
  # Environment,GitHubEvent,GitRepository,Package,Route} decodes
  # attacker-controlled Contract.Raw JSON from CRs and manually walks nested
  # maps/type assertions beyond what encoding/json validates, so fuzzing the
  # existing xWithContract(raw) test helpers exercises that parsing directly.
  # See go.dev/doc/security/fuzz. (ServiceUnit has no equivalent — its CR
  # spec has no raw-JSON contract to decode.)
  #
  # One matrix leg per target so a crasher in one doesn't block the others
  # (fail-fast: false) and each gets its own job summary. 8 legs each spin up
  # ~12 fuzz workers (confirmed locally) — if the self-hosted pool is small,
  # add `max-parallel:` once contention actually shows up in a run.
  #
  # vendor restore: same three-tier fallback as the coverage job (tagged
  # snapshot → latest → inline `go mod vendor`) — this job runs standalone,
  # not gated behind the vendor-snapshot job above.
  # ───────────────────────────────────────────────────────────────────────────
  fuzz:
    name: Fuzz (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 2') ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: FuzzResolveBuild
            pkg: ./resolution/build/resolve/...
          - name: FuzzResolveDeployment
            pkg: ./resolution/deployment/resolve/...
          - name: FuzzResolveDomain
            pkg: ./resolution/domain/resolve/...
          - name: FuzzResolveEnvironment
            pkg: ./resolution/environment/resolve/...
          - name: FuzzResolveGitHubEvent
            pkg: ./resolution/githubevent/resolve/...
          - name: FuzzResolveGitRepository
            pkg: ./resolution/gitrepository/resolve/...
          - name: FuzzResolvePackage
            pkg: ./resolution/packages/resolve/...
          - name: FuzzResolveRoute
            pkg: ./resolution/route/resolve/...
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments,environments-api,environments-contract

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/blanketops/*
          go env -w GONOSUMDB=github.com/blanketops/*
          go env -w GOPROXY=direct

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute vendor tag from go.sum
        id: vendor
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Vendor tag: ${TAG}"

      - name: Restore vendor from snapshot
        run: |
          IMAGE_TAG="${{ env.VENDOR_IMAGE }}:${{ steps.vendor.outputs.tag }}"
          IMAGE_LATEST="${{ env.VENDOR_IMAGE }}:latest"
          rm -rf ./vendor

          if docker pull "${IMAGE_TAG}" 2>/dev/null; then
            echo "Restoring vendor from tagged snapshot: ${IMAGE_TAG}"
            CONTAINER=$(docker create "${IMAGE_TAG}" /nonexistent)
            docker export "${CONTAINER}" | tar -xf - vendor/
            docker rm "${CONTAINER}"
          elif docker pull "${IMAGE_LATEST}" 2>/dev/null; then
            echo "Tagged snapshot not found — restoring from latest: ${IMAGE_LATEST}"
            CONTAINER=$(docker create "${IMAGE_LATEST}" /nonexistent)
            docker export "${CONTAINER}" | tar -xf - vendor/
            docker rm "${CONTAINER}"
          else
            echo "No snapshot available — building vendor inline"
            go mod vendor
          fi

          echo "vendor/ ready — $(find vendor -mindepth 1 -maxdepth 1 -type d | wc -l) packages"
          echo "modules.txt present: $(test -f vendor/modules.txt && echo yes || echo NO)"

      - name: Verify vendor completeness
        id: vendor-check
        continue-on-error: true
        run: |
          go build -mod=vendor ./...
          go vet -mod=vendor ./...

      - name: Rebuild vendor (stale snapshot detected)
        if: steps.vendor-check.outcome == 'failure'
        run: |
          echo "::warning::Restored vendor snapshot (tag ${{ steps.vendor.outputs.tag }}) is incomplete — rebuilding locally and pushing a corrected snapshot."
          go env -w GOPROXY=https://proxy.golang.org,direct
          go mod vendor

      - name: Push corrected vendor snapshot
        if: steps.vendor-check.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          file: tools/Dockerfile
          push: true
          tags: |
            ${{ env.VENDOR_IMAGE }}:${{ steps.vendor.outputs.tag }}
            ${{ env.VENDOR_IMAGE }}:latest

      - name: Run ${{ matrix.target.name }}
        id: fuzz
        run: |
          go test -mod=vendor "${{ matrix.target.pkg }}" \
            -run="${{ matrix.target.name }}" \
            -fuzz="${{ matrix.target.name }}" \
            -fuzztime="${{ github.event.inputs.fuzztime || '60s' }}" \
            -v

      - name: Upload crasher corpus (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crasher-${{ matrix.target.name }}-${{ github.sha }}
          path: resolution/**/testdata/fuzz/**
          retention-days: 30
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status == 'success' && '✅ No crashers found' || '❌ Crasher found — see uploaded artifact' }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🧪 Fuzzing — ${{ matrix.target.name }}

          **Status:** ${STATUS}
          **Duration:** \`${{ github.event.inputs.fuzztime || '60s' }}\`
          **Package:** \`${{ matrix.target.pkg }}\`
          **Vendor tag:** \`${{ steps.vendor.outputs.tag }}\`
          EOF

  # ───────────────────────────────────────────────────────────────────────────
  # Job 7: Vendor Snapshot Cleanup (from vendor-cleanup.yml)
  # Original scope: weekly schedule, or manual dispatch.
  #
  # The vendor-snapshot job above pushes a new
  # ghcr.io/blanketops/environments/tools tag (content-addressed by
  # sha256(go.sum)) whenever go.sum changes, but never deletes old ones.
  # Left unchecked, this grows private-package storage usage without bound.
  # This job prunes everything past the N most recent versions on a
  # schedule, keeping the cache warm for recent go.sum states while capping
  # total storage.
  # ───────────────────────────────────────────────────────────────────────────
  vendor-cleanup:
    name: Prune old vendor snapshots
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Delete old vendor-snapshot versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: environments/tools
          package-type: container
          min-versions-to-keep: 10
