name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  VENDOR_IMAGE: ghcr.io/${{ github.repository }}/vendor-snap

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Vendor Snapshot
  # Builds and pushes the vendor image only when
  # go.sum has changed. All subsequent jobs restore
  # vendor/ from this image — zero network at build time.
  # ─────────────────────────────────────────────
  vendor-snapshot:
    name: Vendor Snapshot
    runs-on: self-hosted
    outputs:
      vendor-tag: ${{ steps.tag.outputs.tag }}
      cache-hit: ${{ steps.check.outputs.hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Compute vendor tag from go.sum
        id: tag
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Vendor tag: ${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if vendor snapshot already exists
        id: check
        run: |
          if docker manifest inspect ${{ env.VENDOR_IMAGE }}:${{ steps.tag.outputs.tag }} > /dev/null 2>&1; then
            echo "hit=true" >> $GITHUB_OUTPUT
            echo "Vendor snapshot exists — skipping build"
          else
            echo "hit=false" >> $GITHUB_OUTPUT
            echo "No snapshot found — will build"
          fi

      - name: Configure Git for private modules
        if: steps.check.outputs.hit == 'false'
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Build and push vendor snapshot
        if: steps.check.outputs.hit == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: vendor-snap/Dockerfile
          push: true
          tags: |
            ${{ env.VENDOR_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.VENDOR_IMAGE }}:latest
          # Pass GH_PAT as a build secret so go mod vendor
          # can fetch private blanketops modules
          secrets: |
            GH_PAT=${{ secrets.GH_PAT }}

  # ─────────────────────────────────────────────
  # Job 2: Validate
  # Restores vendor/ from the snapshot image then
  # runs the full lint/vet/test pipeline with -mod=vendor.
  # ─────────────────────────────────────────────
  validate:
    name: Lint, Vet, Test
    runs-on: self-hosted
    needs: vendor-snapshot
    strategy:
      matrix:
        go-version: ["1.25.7"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Disable Go auto toolchain
        run: go env -w GOTOOLCHAIN=local

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/ntlaletsi70/*
          go env -w GONOSUMDB=github.com/ntlaletsi70/*
          go env -w GOPROXY=direct

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore vendor from snapshot
        run: |
          IMAGE="${{ env.VENDOR_IMAGE }}:${{ needs.vendor-snapshot.outputs.vendor-tag }}"
          echo "Restoring vendor from ${IMAGE}"
          docker pull "${IMAGE}"
          CONTAINER=$(docker create "${IMAGE}")
          docker cp "${CONTAINER}:/vendor" ./vendor
          docker rm "${CONTAINER}"
          echo "vendor/ restored — $(find vendor -mindepth 1 -maxdepth 1 -type d | wc -l) packages"

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
<<<<<<< Updated upstream
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

=======
            ${{ runner.os }}-go-build-${{ matrix.go-version }}-
            ${{ runner.os }}-go-build-
              
>>>>>>> Stashed changes
      - name: Tidy
        run: mage tidy

      - name: Auto-fix formatting
        run: gofmt -w .

      - name: Commit formatting and tidy fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format and tidy [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Build
        run: mage build

      - name: Vet
        run: mage vet

      - name: Install staticcheck
        run: |
          if ! command -v staticcheck &> /dev/null; then
            go install honnef.co/go/tools/cmd/staticcheck@latest
          fi

      - name: Lint
        run: mage lint

      - name: Test
        run: go test -mod=vendor ./... -coverprofile=coverage.out -covermode=atomic

      - name: Ensure coverage file exists
        run: test -f coverage.out

      - name: CI Summary
        if: always()
        run: |
          VENDOR_STATUS="${{ needs.vendor-snapshot.outputs.cache-hit == 'true' && '✅ Cache hit' || '🔨 Rebuilt' }}"
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # ✅ Validation Complete
          **Go Version:** \`${{ matrix.go-version }}\`

          ## Vendor Snapshot
          | Key | Value |
          | --- | --- |
          | Tag | \`${{ needs.vendor-snapshot.outputs.vendor-tag }}\` |
          | Status | ${VENDOR_STATUS} |
          | Image | \`${{ env.VENDOR_IMAGE }}\` |

          ## Checks Executed
          | Step | Tool |
          | --- | --- |
          | Dependency tidy | \`mage tidy\` |
          | Auto-format | \`gofmt\` |
          | Build | \`mage build\` |
          | Vet | \`mage vet\` |
          | Lint | \`mage lint\` (staticcheck) |
          | Test | \`go test -mod=vendor\` |
          | Coverage | \`coverage.out\` |
          EOF