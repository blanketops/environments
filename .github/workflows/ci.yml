name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    name: Lint, Vet, Test
    runs-on: self-hosted
    strategy:
      matrix:
        go-version: ["1.25.7", "1.26.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Disable Go auto toolchain
        run: go env -w GOTOOLCHAIN=local

      # 🔐 Configure access to private modules (PAT-based)
      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/ntlaletsi70/*
          go env -w GONOSUMDB=github.com/ntlaletsi70/*
          go env -w GOPROXY=direct

      - name: Tidy go.mod
        run: go mod tidy

      # ✨ Auto-fix formatting and commit back — never a CI blocker
      - name: Auto-fix formatting
        run: gofmt -w .

      - name: Commit formatting and tidy fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format and tidy [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: |
          if ! command -v staticcheck &> /dev/null; then
            go install honnef.co/go/tools/cmd/staticcheck@latest
          fi

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run tests
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Ensure coverage file exists
        run: test -f coverage.out

      - name: CI Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY 
          <<EOF 
           # ✅ Validation Complete 
           ## Go Version \`${{ matrix.go-version }}\` 
             ## Checks Executed
                - go mod tidy 
                - gofmt 
                - go vet 
                - staticcheck 
                - go test 
                - coverage generation 
           ## Result All validation steps completed successfully.
           EOF
