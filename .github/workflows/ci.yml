name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Vet, Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go-version: ["1.22.x", "1.23.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add github.com to known_hosts
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure git to use SSH instead of HTTPS
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Configure Go private modules
        run: |
          go env -w GOPRIVATE=github.com/ntlaletsi70/*
          go env -w GONOSUMDB=github.com/ntlaletsi70/*
      - name: Verify go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run tests
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Ensure coverage file exists
        run: test -f coverage.out
