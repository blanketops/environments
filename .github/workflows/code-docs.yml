# =============================================================================
# code-docs.yml — Generated Go Package Docs
#
# Runs on every push to main. Generates Go package docs via gomarkdoc and
# commits them back to docs/code/, plus uploads a retained artifact copy.
#
# Secrets required:
#   GH_PAT           — commit/push to main + private module access
#   SSH_PRIVATE_KEY  — signs the generated-docs commit
# =============================================================================

name: Code Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  godoc:
    name: Generate Code Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Configure Git for private modules
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/BlanketOps/*
          go env -w GONOSUMDB=github.com/BlanketOps/*
          go env -w GOPROXY=direct

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Generate docs
        run: |
          mkdir -p docs/code
          gomarkdoc \
            --output 'docs/code/{{.Dir}}.md' \
            ./core/... \
            ./cache/... \
            ./logging/... \
            ./pkg/... \
            ./resolution/... \
            ./runtime/...

      - name: Configure SSH commit signing
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          ssh-keygen -y -f ~/.ssh/signing_key > ~/.ssh/signing_key.pub
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/signing_key.pub
          git config --global commit.gpgsign true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push docs
        run: |
          git add docs/code/ -f
          if ! git diff-index --quiet HEAD; then
            git commit -S -m "docs: auto-generate code documentation [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No documentation changes to commit"
          fi

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: godoc-${{ github.sha }}
          path: docs/code/
          retention-days: 30

      - name: Build summary
        run: |
          echo "## 📚 Code Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Generated from commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for group in core cache logging pkg resolution runtime; do
            files=$(find docs/code -name "*.md" | grep "/${group}" | sort)
            if [ -n "$files" ]; then
              echo "### \`${group}/\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              for f in $files; do
                pkg=$(basename "$f" .md)
                echo "- \`${pkg}\`" >> $GITHUB_STEP_SUMMARY
              done
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "> 📦 Download artifact \`godoc-${{ github.sha }}\` from the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) to browse all generated docs." >> $GITHUB_STEP_SUMMARY
