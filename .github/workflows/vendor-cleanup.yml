# =============================================================================
# vendor-cleanup.yml — prune old vendor-snapshot images from GHCR
#
# ci.yml's vendor-snapshot job pushes a new ghcr.io/blanketops/environments/tools
# tag (content-addressed by sha256(go.sum)) whenever go.sum changes, but never
# deletes old ones. Left unchecked, this grows private-package storage usage
# without bound. This job prunes everything past the N most recent versions
# on a schedule, keeping the cache warm for recent go.sum states while
# capping total storage.
# =============================================================================

name: Vendor Snapshot Cleanup

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  packages: write

jobs:
  cleanup:
    name: Prune old vendor snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Delete old vendor-snapshot versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: environments/tools
          package-type: container
          min-versions-to-keep: 10
