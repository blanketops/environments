# ===================================================================================
# slsa-provenance.yml — SLSA level-3 provenance for the docs bundle
#
# Generates SLSA level-3 build provenance (slsa-framework/slsa-github-generator)
# for the one artifact this repo actually builds: the gomarkdoc docs bundle
# (docs-{version}.tar.gz). This repo has no cmd/ of its own — the CRD/install
# manifests and CLI binaries attached to a release come from
# BlanketOps/environments-install and BlanketOps/environments-cli
# respectively (bundled by release-assets.yml), so provenance for those is
# each of those repos' own responsibility, not something this workflow
# should claim to attest.
#
# The `build` job rebuilds the docs bundle independently, in its own job, so
# the hash it feeds to the provenance generator is guaranteed to match
# exactly what it built (no cross-workflow reproducibility assumption). It
# does not re-upload docs-{version}.tar.gz itself — release-assets.yml's
# `docs` job remains the sole owner of that upload. Only the provenance
# attestation (*.intoto.jsonl) is uploaded here, by the reusable workflow.
#
# This is a Signed-Releases (OpenSSF Scorecard) fix — that check scans
# release assets for exactly this kind of file.
#
# Fixed version pin: v2.1.0 is the actual latest upstream tag as of writing
# (verified against the slsa-github-generator repo directly) — the version
# pinned in GitHub's own starter template for this workflow (v1.4.0) is
# stale, do not copy it from there again.
#
# PAUSED (2026-10-10): the generator's reusable workflow only runs on
# GitHub-hosted runners, and the organization cannot start those at the
# moment ("account is locked due to a billing issue"). It failed on every
# release, so the release trigger is removed and the workflow only runs when
# started by hand. No release since v0.8.5 has provenance. When hosted runners
# work again, put the `release: types: [created]` trigger back, and restore
# the provenance line in SECURITY.md, README.md and ROADMAP.md.
#
# Generates SLSA build provenance locally on self-hosted runners using direct
# binary tooling, bypassing GitHub-hosted runner billing constraints while
# preserving structural integrity for the gomarkdoc docs bundle (docs-{version}.tar.gz).
# ========================================================================================

name: SLSA Local Generator

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attribute (e.g. v0.8.6)'
        required: false
        default: 'v0.8.6'

env:
  GO_VERSION_FILE: go.mod

jobs:
  build-and-attest:
    runs-on: self-hosted
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Build docs artifact
        run: |
          mkdir -p .release-docs
          gomarkdoc --output .release-docs/cache.md             ./cache/...                 || true
          gomarkdoc --output .release-docs/core.md              ./core/...                  || true
          gomarkdoc --output .release-docs/pkg-build.md         ./pkg/apis/build/...          || true
          gomarkdoc --output .release-docs/pkg-deployment.md    ./pkg/apis/deployment/...     || true
          gomarkdoc --output .release-docs/pkg-domain.md        ./pkg/apis/domain/...         || true
          gomarkdoc --output .release-docs/pkg-environment.md   ./pkg/apis/environment/...    || true
          gomarkdoc --output .release-docs/pkg-route.md         ./pkg/apis/route/...          || true
          gomarkdoc --output .release-docs/pkg-packages.md      ./pkg/apis/packages/...       || true
          gomarkdoc --output .release-docs/pkg-gitrepository.md ./pkg/apis/gitrepository/...  || true
          gomarkdoc --output .release-docs/pkg-githubevent.md   ./pkg/apis/githubevent/...    || true
          gomarkdoc --output .release-docs/pkg-utils.md         ./pkg/utils/...               || true
          gomarkdoc --output .release-docs/pkg-secrets.md       ./pkg/secrets/...             || true
          gomarkdoc --output .release-docs/pkg-intent.md        ./pkg/intent/...              || true
          gomarkdoc --output .release-docs/pkg-resolution.md    ./resolution/...              || true

          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          tar -czf "docs-${VERSION}.tar.gz" -C .release-docs .

      - name: Generate Local Provenance Attestation
        run: |
          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          
          # Ensure local generation tool is available on runner or download binary
          if ! command -v slsa-gen-gopath &> /dev/null; then
            echo "Installing SLSA generator utility..."
            go install github.com/slsa-framework/slsa-github-generator/cli/slsa-generator@v2.1.0
          fi

          echo "Generating provenance for docs-${VERSION}.tar.gz..."
          slsa-generator generate \
            --subject "docs-${VERSION}.tar.gz" \
            --output "docs-${VERSION}.tar.gz.intoto.jsonl"
          
          echo "Provenance generated successfully."

      - name: Attach Provenance to Release
        run: |
          VERSION="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          
          # If running against an existing release or pushing assets via GitHub CLI
          if gh release view "${VERSION}" &>/dev/null; then
            gh release upload "${VERSION}" "docs-${VERSION}.tar.gz.intoto.jsonl" --clobber
            echo "Uploaded provenance asset to GitHub Release ${VERSION}."
          else
            echo "Release ${VERSION} not found; provenance stored as workflow artifact."
          fi

      - name: Upload local provenance artifact to GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          
          # Upload all generated in-toto provenance files directly to the release
          for prov in docs-*.tar.gz.intoto.jsonl; do
            if [ -f "$prov" ]; then
              echo "Attaching provenance $prov to release $VERSION..."
              gh release upload "$VERSION" "$prov" --repo "${{ github.repository }}" --clobber
            fi
          done
