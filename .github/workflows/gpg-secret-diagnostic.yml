# =============================================================================
# gpg-secret-diagnostic.yml — TEMPORARY debug workflow
#
# Diagnoses the Finalize Release GPG signing failure ("Inappropriate ioctl
# for device") by checking whether GPG_PASSPHRASE or GPG_PRIVATE_KEY carry
# trailing/leading whitespace — never prints the secret values themselves,
# only lengths and a same/different verdict.
#
# Delete this file once the diagnosis is confirmed.
# =============================================================================

name: GPG Secret Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets for stray whitespace
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          check_trailing() {
            local name="$1"
            local val="$2"
            local raw_len=${#val}
            local trimmed
            trimmed="$(printf '%s' "$val" | sed -e 's/[[:space:]]*$//' -e 's/^[[:space:]]*//')"
            local trimmed_len=${#trimmed}
            echo "${name}: raw_len=${raw_len} trimmed_len=${trimmed_len} $( [ "$raw_len" -ne "$trimmed_len" ] && echo '<-- HAS LEADING/TRAILING WHITESPACE' || echo 'OK' )"
          }
          check_trailing "GPG_PASSPHRASE" "$GPG_PASSPHRASE"
          check_trailing "GPG_PRIVATE_KEY" "$GPG_PRIVATE_KEY"

      - name: Import key and attempt a real signature (isolated GNUPGHOME)
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>&1 || true
          KEYID=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "Imported KeyID: ${KEYID}"

          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent || true

          echo "test payload" > /tmp/payload.txt
          if gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
               --local-user "$KEYID" --detach-sign /tmp/payload.txt 2>gpg_err.txt; then
            echo "RESULT: passphrase is CORRECT — signing succeeded with --passphrase directly."
          else
            echo "RESULT: passphrase is INCORRECT or key mismatch — signing failed even with explicit --passphrase."
            cat gpg_err.txt
          fi
