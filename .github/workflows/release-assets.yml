# =============================================================================
# release-assets.yml
#
# Fires on GitHub Release published. Bleeds four asset bundles:
#
#   install-{version}.yaml     — single-file controller installer (THE one)
#                                kubectl apply -f install-{version}.yaml = done.
#
#   crds-{version}.tar.gz      — CRD YAML files only, for consumers who manage
#                                CRDs separately from the controller rollout
#
#   docs-{version}.tar.gz      — generated Go package docs via gomarkdoc
#
#   bops, bops-static, bops-static-arm64 — CLI binaries
#
# All assets are uploaded directly to the triggering GitHub Release.
#
# This repo has no cmd/ or config/ of its own — it is a pure domain/caching
# library. The controller install manifests (kustomize config/, CRDs) live in
# BlanketOps/environments-install, and the CLI lives in
# BlanketOps/environments-cli. Both are versioned independently; every job
# below always bundles whatever is newest in the relevant repo at release time.
#
# Asset ownership:
#   install → bundled in the install job from environments-install's latest release
#   CRDs    → bundled in the crds job from environments-install's config/crd/bases/
#   Docs    → built in the docs job; generated via gomarkdoc
#   CLI     → bundled in the cli job from environments-cli's latest release
#
# Image convention:
#   ghcr.io/blanketops/environments-controller:{version}
#   Stamped into config/manager/kustomization.yaml in environments-install
#   before that repo's kustomize build. The image must already exist in
#   GHCR — pushed by the image CI workflow.
#
# Permissions:
#   contents: write — required for gh release upload
# =============================================================================

name: Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  GO_VERSION_FILE: go.mod

jobs:

  # ---------------------------------------------------------------------------
  # Install manifest (THE asset)
  #
  # Produces the single-file controller installer: install-{version}.yaml
  #
  # What it contains (built by BlanketOps/environments-install via kustomize
  # build config/default, published there as a release asset):
  #   - Namespace
  #   - CRDs
  #   - ServiceAccount + ClusterRole + ClusterRoleBinding
  #   - Controller Deployment
  #   - Any platform ConfigMaps or webhooks declared in that repo's config/default
  #
  # Consumer install:
  #   kubectl apply -f install-{version}.yaml
  #
  # This repo has no config/ of its own — the kustomize base, CRDs, and RBAC
  # all live in BlanketOps/environments-install, versioned independently.
  # This job always bundles whatever is newest there at release time.
  # ---------------------------------------------------------------------------
  install:
    name: Bundle Install Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest environments-install release
        id: install_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INSTALL_TAG=$(gh release list --repo BlanketOps/environments-install --limit 1 | awk '{print $1}')
          echo "tag=${INSTALL_TAG}" >> "$GITHUB_OUTPUT"
          echo "Bundling environments-install ${INSTALL_TAG}"

      - name: Download install manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .install-assets
          gh release download "${{ steps.install_version.outputs.tag }}" \
            --repo BlanketOps/environments-install \
            --pattern "install.yaml" \
            --dir .install-assets

      - name: Rename and validate manifest
        id: manifest
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          MANIFEST="install-${VERSION}.yaml"
          mv .install-assets/install.yaml "${MANIFEST}"
          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"
          LINES=$(wc -l < "${MANIFEST}")
          echo "Manifest lines: ${LINES}"
          if [ "${LINES}" -lt 10 ]; then
            echo "ERROR: install manifest suspiciously small (${LINES} lines) — aborting"
            exit 1
          fi

      - name: Upload install manifest to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.manifest.outputs.manifest }}" \
            --clobber

      - name: Summary
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          LINES=$(wc -l < "${{ steps.manifest.outputs.manifest }}")
          echo "### 🚀 Install Manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Version | Lines |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.manifest.outputs.manifest }}\` | \`${VERSION}\` | \`${LINES}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bundled from:** \`BlanketOps/environments-install@${{ steps.install_version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Install:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "kubectl apply -f ${{ steps.manifest.outputs.manifest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Resource kinds in manifest:**" >> "$GITHUB_STEP_SUMMARY"
          grep "^kind:" "${{ steps.manifest.outputs.manifest }}" | sort | uniq -c | sort -rn | \
            awk '{print "- `" $2 "` × " $1}' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # CRDs
  # Packages the CRD YAML files from BlanketOps/environments-install's
  # config/crd/bases/ (at its latest release tag) into a single tarball and
  # uploads it to this release. Consumers apply with:
  #   kubectl apply -f crds-{version}.tar.gz
  # or extract and apply individually.
  # ---------------------------------------------------------------------------
  crds:
    name: Package CRDs
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest environments-install release
        id: install_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INSTALL_TAG=$(gh release list --repo BlanketOps/environments-install --limit 1 | awk '{print $1}')
          echo "tag=${INSTALL_TAG}" >> "$GITHUB_OUTPUT"
          echo "Bundling CRDs from environments-install ${INSTALL_TAG}"

      - name: Checkout environments-install CRDs
        uses: actions/checkout@v4
        with:
          repository: BlanketOps/environments-install
          ref: ${{ steps.install_version.outputs.tag }}
          path: environments-install
          sparse-checkout: config/crd/bases
          sparse-checkout-cone-mode: false

      - name: Package CRD bundle
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          BUNDLE="crds-${VERSION}.tar.gz"
          tar -czf "${BUNDLE}" -C environments-install/config/crd/bases .
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
        id: bundle

      - name: Upload CRD bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.bundle.outputs.bundle }}" \
            --clobber

      - name: Summary
        run: |
          echo "### 📦 CRD Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.bundle.outputs.bundle }}\` | \`${{ steps.version.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bundled from:** \`BlanketOps/environments-install@${{ steps.install_version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Contents:**" >> "$GITHUB_STEP_SUMMARY"
          tar -tzf "${{ steps.bundle.outputs.bundle }}" | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Docs
  # Generates Go package documentation via gomarkdoc and packages it as a
  # tarball. Each package gets its own markdown file under docs/.
  # ---------------------------------------------------------------------------
  docs:
    name: Generate and Package Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate docs
        run: |
          mkdir -p .release-docs
          # Core packages
          gomarkdoc --output .release-docs/cache.md              ./cache/...                  || true
          gomarkdoc --output .release-docs/core.md               ./core/...                   || true
          # Domain packages (pkg/apis/<domain>)
          gomarkdoc --output .release-docs/pkg-build.md          ./pkg/apis/build/...          || true
          gomarkdoc --output .release-docs/pkg-deployment.md     ./pkg/apis/deployment/...     || true
          gomarkdoc --output .release-docs/pkg-domain.md         ./pkg/apis/domain/...         || true
          gomarkdoc --output .release-docs/pkg-environment.md    ./pkg/apis/environment/...    || true
          gomarkdoc --output .release-docs/pkg-route.md          ./pkg/apis/route/...          || true
          gomarkdoc --output .release-docs/pkg-packages.md       ./pkg/apis/packages/...       || true
          gomarkdoc --output .release-docs/pkg-gitrepository.md  ./pkg/apis/gitrepository/...  || true
          gomarkdoc --output .release-docs/pkg-githubevent.md    ./pkg/apis/githubevent/...    || true
          # Shared pkg utilities
          gomarkdoc --output .release-docs/pkg-utils.md          ./pkg/utils/...               || true
          gomarkdoc --output .release-docs/pkg-secrets.md        ./pkg/secrets/...             || true
          gomarkdoc --output .release-docs/pkg-intent.md         ./pkg/intent/...              || true
          # Resolution packages
          gomarkdoc --output .release-docs/resolution.md         ./resolution/...              || true

      - name: Package docs bundle
        id: bundle
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          BUNDLE="docs-${VERSION}.tar.gz"
          tar -czf "${BUNDLE}" -C .release-docs .
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Upload docs bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.bundle.outputs.bundle }}" \
            --clobber

      - name: Summary
        run: |
          echo "### 📚 Docs Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.bundle.outputs.bundle }}\` | \`${{ steps.version.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Packages documented:**" >> "$GITHUB_STEP_SUMMARY"
          ls .release-docs/ | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # CLI
  # The `bops` CLI is developed and released independently in
  # BlanketOps/environments-cli. This job always bundles whatever is newest
  # there into this release, rather than building a CLI from this repo
  # (there is no cmd/ entrypoint here).
  # ---------------------------------------------------------------------------
  cli:
    name: Bundle CLI Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest environments-cli release
        id: cli_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLI_TAG=$(gh release list --repo BlanketOps/environments-cli --limit 1 | awk '{print $1}')
          echo "tag=${CLI_TAG}" >> "$GITHUB_OUTPUT"
          echo "Bundling environments-cli ${CLI_TAG}"

      - name: Download CLI binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cli-assets
          gh release download "${{ steps.cli_version.outputs.tag }}" \
            --repo BlanketOps/environments-cli \
            --dir .cli-assets

      - name: Upload CLI binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            .cli-assets/* \
            --clobber

      - name: Summary
        run: |
          echo "### 💻 CLI Binaries" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundled from \`BlanketOps/environments-cli@${{ steps.cli_version.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|------|" >> "$GITHUB_STEP_SUMMARY"
          for f in .cli-assets/*; do
            SIZE=$(ls -lh "$f" | awk '{print $5}')
            echo "| \`$(basename "$f")\` | \`${SIZE}\` |" >> "$GITHUB_STEP_SUMMARY"
          done