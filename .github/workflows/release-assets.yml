# =============================================================================
# release-assets.yml
#
# Fires on GitHub Release published. Bleeds four asset bundles:
#
#   install-{version}.yaml     — single-file controller installer (THE one)
#                                kustomize build config/default with image tag
#                                stamped. kubectl apply -f install.yaml = done.
#
#   crds-{version}.tar.gz      — CRD YAML files only, for consumers who manage
#                                CRDs separately from the controller rollout
#
#   docs-{version}.tar.gz      — generated Go package docs via gomarkdoc
#
#   blanketops-{version}-{os}-{arch} — CLI binaries (multi-platform)
#
# All assets are uploaded directly to the triggering GitHub Release.
#
# Asset ownership:
#   install → built in the install job; kustomize build config/default
#   CRDs    → built in the crds job; sourced from config/crd/bases/
#   Docs    → built in the docs job; generated via gomarkdoc
#   CLI     → built in the cli job; cross-compiled for linux/darwin/windows
#
# Image convention:
#   ghcr.io/ntlaletsi70/blanketops-environments-controller:{version}
#   Stamped into config/manager/kustomization.yaml before kustomize build.
#   The image must already exist in GHCR — pushed by the image CI workflow.
#
# CLI binary naming convention:
#   blanketops-{version}-linux-amd64
#   blanketops-{version}-linux-arm64
#   blanketops-{version}-darwin-amd64
#   blanketops-{version}-darwin-arm64
#   blanketops-{version}-windows-amd64.exe
#
# Permissions:
#   contents: write — required for gh release upload
# =============================================================================

name: release-assets

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  GO_VERSION_FILE: go.mod

jobs:

  # ---------------------------------------------------------------------------
  # Install manifest (THE asset)
  #
  # Produces the single-file controller installer: install-{version}.yaml
  #
  # What it contains (kustomize build config/default):
  #   - Namespace
  #   - CRDs
  #   - ServiceAccount + ClusterRole + ClusterRoleBinding
  #   - Controller Deployment (image tag stamped to this release)
  #   - Any platform ConfigMaps or webhooks declared in config/default
  #
  # Consumer install:
  #   kubectl apply -f install-{version}.yaml
  #
  # Image must already exist in GHCR. The image CI workflow (image.yml or
  # ko.yml) is responsible for pushing the image before the release fires.
  # ---------------------------------------------------------------------------
  install:
    name: Build Install Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Stamp controller image tag
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          IMAGE="ghcr.io/ntlaletsi70/blanketops-environments-controller:${VERSION}"
          cd config/manager
          kustomize edit set image controller="${IMAGE}"
          echo "Stamped image: ${IMAGE}"

      - name: Build install manifest
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          MANIFEST="install-${VERSION}.yaml"
          kustomize build config/default > "${MANIFEST}"
          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"
        id: manifest

      - name: Validate manifest is non-empty
        run: |
          LINES=$(wc -l < "${{ steps.manifest.outputs.manifest }}")
          echo "Manifest lines: ${LINES}"
          if [ "${LINES}" -lt 10 ]; then
            echo "ERROR: install manifest suspiciously small (${LINES} lines) — aborting"
            exit 1
          fi

      - name: Upload install manifest to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.manifest.outputs.manifest }}" \
            --clobber

      - name: Summary
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          IMAGE="ghcr.io/ntlaletsi70/blanketops-environments-controller:${VERSION}"
          LINES=$(wc -l < "${{ steps.manifest.outputs.manifest }}")
          echo "### 🚀 Install Manifest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Version | Lines |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.manifest.outputs.manifest }}\` | \`${VERSION}\` | \`${LINES}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Controller image:** \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Install:**" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`bash" >> "$GITHUB_STEP_SUMMARY"
          echo "kubectl apply -f ${{ steps.manifest.outputs.manifest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Resource kinds in manifest:**" >> "$GITHUB_STEP_SUMMARY"
          grep "^kind:" "${{ steps.manifest.outputs.manifest }}" | sort | uniq -c | sort -rn | \
            awk '{print "- `" $2 "` × " $1}' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # CRDs
  # Packages all CRD YAML files from config/crd/bases/ into a single tarball
  # and uploads it to the release. Consumers apply with:
  #   kubectl apply -f crds-{version}.tar.gz
  # or extract and apply individually.
  # ---------------------------------------------------------------------------
  crds:
    name: Package CRDs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package CRD bundle
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          BUNDLE="crds-${VERSION}.tar.gz"
          tar -czf "${BUNDLE}" -C config/crd/bases .
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
        id: bundle

      - name: Upload CRD bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.bundle.outputs.bundle }}" \
            --clobber

      - name: Summary
        run: |
          echo "### 📦 CRD Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.bundle.outputs.bundle }}\` | \`${{ steps.version.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Contents:**" >> "$GITHUB_STEP_SUMMARY"
          tar -tzf "${{ steps.bundle.outputs.bundle }}" | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Docs
  # Generates Go package documentation via gomarkdoc and packages it as a
  # tarball. Each package gets its own markdown file under docs/.
  # ---------------------------------------------------------------------------
  docs:
    name: Generate and Package Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Generate docs
        run: |
          mkdir -p .release-docs
          # Core packages
          gomarkdoc --output .release-docs/cache.md          ./cache/...          || true
          gomarkdoc --output .release-docs/core.md           ./core/...           || true
          gomarkdoc --output .release-docs/logging.md        ./logging/...        || true
          # Domain packages
          gomarkdoc --output .release-docs/pkg-build.md      ./pkg/build/...      || true
          gomarkdoc --output .release-docs/pkg-deployment.md ./pkg/deployment/... || true
          gomarkdoc --output .release-docs/pkg-domain.md     ./pkg/domain/...     || true
          gomarkdoc --output .release-docs/pkg-route.md      ./pkg/route/...      || true
          gomarkdoc --output .release-docs/pkg-serviceunit.md ./pkg/serviceunit/... || true
          gomarkdoc --output .release-docs/pkg-gitrepository.md ./pkg/gitrepository/... || true
          gomarkdoc --output .release-docs/pkg-githubevent.md ./pkg/githubevent/... || true
          # Resolution packages
          gomarkdoc --output .release-docs/resolution.md     ./resolution/...     || true

      - name: Package docs bundle
        id: bundle
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          BUNDLE="docs-${VERSION}.tar.gz"
          tar -czf "${BUNDLE}" -C .release-docs .
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Upload docs bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.bundle.outputs.bundle }}" \
            --clobber

      - name: Summary
        run: |
          echo "### 📚 Docs Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.bundle.outputs.bundle }}\` | \`${{ steps.version.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Packages documented:**" >> "$GITHUB_STEP_SUMMARY"
          ls .release-docs/ | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # CLI
  # Cross-compiles the BlanketOps CLI binary for all supported platforms.
  # Assumes cmd/blanketops/main.go as the CLI entrypoint.
  # Binary naming: blanketops-{version}-{os}-{arch}[.exe]
  # ---------------------------------------------------------------------------
  cli:
    name: Build CLI — ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build CLI binary
        env:
          GOOS:   ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          BINARY="blanketops-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build \
            -mod=vendor \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o "${BINARY}" \
            ./cmd/blanketops/...
          echo "binary=${BINARY}" >> "$GITHUB_OUTPUT"
        id: build

      - name: Upload CLI binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.build.outputs.binary }}" \
            --clobber

      - name: Summary
        run: |
          echo "### 💻 CLI Binary — ${{ matrix.os }}/${{ matrix.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Asset | OS | Arch | Version |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|----|------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ steps.build.outputs.binary }}\` | \`${{ matrix.os }}\` | \`${{ matrix.arch }}\` | \`${{ steps.version.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -lh "${{ steps.build.outputs.binary }}" | awk '{print "**Size:** `" $5 "`"}' >> "$GITHUB_STEP_SUMMARY"