# =============================================================================
# release-assets.yml — Bundle release assets (installer, CRDs, docs, CLI, coverage)
#
# Fires on GitHub Release published or via manual dispatch. Bundles five primary
# release asset archives and attaches them directly to the GitHub Release via `gh`:
#
#   install-{version}.yaml    — single-file controller installer (kubectl apply -f)
#   crds-{version}.tar.gz     — CRD YAML files from BlanketOps/environments-install
#   godoc-{version}.tar.gz    — generated Go package documentation via gomarkdoc
#   coverage-{version}.tar.gz — raw coverage profile, native HTML & beauty-report.html
#   bops*                     — CLI binaries bundled from BlanketOps/environments-cli
#
# All assets are uploaded directly to the triggering GitHub Release, bypassing
# internal GitHub Actions artifact storage quota constraints and self-hosted runner
# upload failures.
# =============================================================================

name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to attach assets to (e.g. v0.8.6)"
        required: true

permissions:
  contents: write

env:
  GO_VERSION_FILE: go.mod
  REGISTRY: ghcr.io
  VENDOR_IMAGE: ghcr.io/blanketops/environments/tools

jobs:
  install:
    name: Bundle Install Manifest
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments

      - name: Resolve version
        id: version
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest environments-install release
        id: install_version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          INSTALL_TAG=$(gh release list --repo BlanketOps/environments-install --limit 1 | awk '{print $1}')
          echo "tag=${INSTALL_TAG}" >> "$GITHUB_OUTPUT"
          echo "Bundling environments-install ${INSTALL_TAG}"

      - name: Download install manifest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p .install-assets
          gh release download "${{ steps.install_version.outputs.tag }}" \
            --repo BlanketOps/environments-install \
            --pattern "install.yaml" \
            --dir .install-assets

      - name: Rename and validate manifest
        id: manifest
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          MANIFEST="install-${VERSION}.yaml"
          mv .install-assets/install.yaml "${MANIFEST}"
          echo "manifest=${MANIFEST}" >> "$GITHUB_OUTPUT"
          LINES=$(wc -l < "${MANIFEST}")
          echo "Manifest lines: ${LINES}"
          if [ "${LINES}" -lt 10 ]; then
            echo "ERROR: install manifest suspiciously small (${LINES} lines) — aborting"
            exit 1
          fi

      - name: Upload install manifest to release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${{ steps.manifest.outputs.manifest }}" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Summary
        if: always()
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          LINES=$(wc -l < "${{ steps.manifest.outputs.manifest }}")
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 🚀 Install Manifest Attached

          - **Asset:** \`${{ steps.manifest.outputs.manifest }}\`
          - **Lines:** \`${LINES}\`
          - **Source:** \`BlanketOps/environments-install@${{ steps.install_version.outputs.tag }}\`
          EOF
  crds:
    name: Package CRDs
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments

      - name: Resolve version
        id: version
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve latest environments-install release
        id: install_version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          INSTALL_TAG=$(gh release list --repo BlanketOps/environments-install --limit 1 | awk '{print $1}')
          echo "tag=${INSTALL_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout environments-install CRDs
        uses: actions/checkout@v7
        with:
          repository: BlanketOps/environments-install
          ref: ${{ steps.install_version.outputs.tag }}
          path: environments-install
          sparse-checkout: config/crd/bases
          sparse-checkout-cone-mode: false

      - name: Package & upload CRD bundle
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          BUNDLE="crds-${VERSION}.tar.gz"
          tar -czf "${BUNDLE}" -C environments-install/config/crd/bases .
          gh release upload "${VERSION}" "${BUNDLE}" --repo "${{ github.repository }}" --clobber
  docs:
    name: Build & Package Code Docs
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments

      - name: Resolve version
        id: version
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Install gomarkdoc and package docs bundle
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@latest
          mkdir -p .release-docs
          
          # Generate package-level Go documentation
          gomarkdoc --output '.release-docs/{{.Dir}}.md' \
            ./core/... \
            ./cache/... \
            ./logging/... \
            ./pkg/... \
            ./resolution/... \
            ./runtime/... || true

          VERSION=${{ steps.version.outputs.tag }}
          BUNDLE="godoc-${VERSION}.tar.gz"
          tar -czf "${BUNDLE}" -C .release-docs .
          
          echo "Uploading ${BUNDLE} to release ${VERSION}..."
          gh release upload "${VERSION}" "${BUNDLE}" --repo "${{ github.repository }}" --clobber

  coverage:
    name: Build & Package Beautified Coverage
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments

      - name: Resolve version
        id: version
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore vendor from snapshot
        run: |
          TAG=$(sha256sum go.sum | cut -d' ' -f1 | cut -c1-12)
          hack/vendor-snapshot.sh restore "${{ env.VENDOR_IMAGE }}" "${TAG}" || go mod vendor

      - name: Run tests and generate coverage profile
        run: |
          go test -mod=vendor -v -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Build patched gocov & install gocov-html
        run: |
          git clone --depth 1 --branch v1.2.1 https://github.com/axw/gocov.git /tmp/gocov-src
          cd /tmp/gocov-src
          go mod edit -replace golang.org/x/tools=golang.org/x/tools@v0.48.0
          go mod tidy
          go build -o "$(go env GOPATH)/bin/gocov" ./gocov
          
          go install github.com/matm/gocov-html/cmd/gocov-html@latest

      - name: Generate beauty-report.html
        run: |
          gocov convert coverage.out | gocov-html > beauty-report.html

      - name: Package & upload coverage bundle
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          BUNDLE="coverage-${VERSION}.tar.gz"
          
          tar -czf "${BUNDLE}" coverage.out coverage.html beauty-report.html
          echo "Uploading ${BUNDLE} to release ${VERSION}..."
          gh release upload "${VERSION}" "${BUNDLE}" --repo "${{ github.repository }}" --clobber

  cli:
    name: Bundle CLI Binaries
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments

      - name: Resolve version
        id: version
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download & upload CLI binaries
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          CLI_TAG=$(gh release list --repo BlanketOps/environments-cli --limit 1 | awk '{print $1}')
          mkdir -p .cli-binaries
          gh release download "${CLI_TAG}" \
            --repo BlanketOps/environments-cli \
            --dir .cli-binaries

          gh release upload "${VERSION}" .cli-binaries/* --repo "${{ github.repository }}" --clobber
